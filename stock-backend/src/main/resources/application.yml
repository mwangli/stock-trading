server:
  port: 8080
  servlet:
    session:
      timeout: ${HTTP_SESSION_TIMEOUT:8h}
      cookie:
        name: STOCK_SESSION
        http-only: true
        same-site: lax
        secure: ${HTTP_SESSION_COOKIE_SECURE:false}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml

# AI_GENERATE_START -----
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: stock-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST_IP:117.72.216.67}:${MYSQL_PORT:6033}/stock_trading?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:10}
      minimum-idle: ${MYSQL_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  main:
    allow-bean-definition-overriding: true
  data:
    mongodb:
      auto-index-creation: true
      uri: mongodb://admin:${MONGO_ROOT_PASSWORD}@${MONGO_HOST_IP:117.72.216.67}:${MONGO_PORT:27017}/stock_trading?authSource=admin
    redis:
      host: ${SPRING_DATA_REDIS_HOST:117.72.216.67}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3s
      connect-timeout: 3s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
  session:
    store-type: redis
    redis:
      namespace: stock:session
      flush-mode: on-save
      save-mode: on-set-attribute

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  quartz:
    job-store-type: memory
    auto-startup: ${SPRING_QUARTZ_AUTO_STARTUP:true}
    startup-delay: 5s
    overwrite-existing-jobs: false
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: stock-trading-quartz
      org.quartz.scheduler.instanceId: NON_CLUSTERED
      org.quartz.threadPool.threadCount: 5
      org.quartz.jobStore.misfireThreshold: 60000

# ZX证券协议参数。默认关闭，真实值必须由运行环境注入。
zxbroker:
  enabled: true
  mobile-code: ${ZXBROKER_MOBILE_CODE:}
  account: ${ZXBROKER_ACCOUNT:}
  encoded-password: ${ZXBROKER_ENCODED_PASSWORD:}

  captcha-auto-submit-enabled: true
  ocr-timeout-ms: 20000
  ocr-request-interval-ms: 1050
  baidu-ocr-api-key: ${BAIDU_OCR_API_KEY:}
  baidu-ocr-secret-key: ${BAIDU_OCR_SECRET_KEY:}
  captcha-max-retries: 3
  sign-key: ${ZXBROKER_SIGN_KEY:}
  intact-to-server: ${ZXBROKER_INTACT_TO_SERVER:}
  token-expire-minutes: 30
  history-page-size: 500
  history-max-records-per-window: 5000
  history-request-interval-ms: 200

trading:
  # 自动真实交易固定参数；真实委托仍必须显式开启总门禁。
  real-write-enabled: false
  history-month-interval-ms: 500
  auto-buy-amount: 1000
  auto-candidate-limit: 1
  take-profit-percent: 3
  force-exit-time: "14:50"

internal:
  api:
    token: ${INTERNAL_API_TOKEN:}

backtest:
  universe-limit: 500
  lookback-days: 5
  random-seed: 20260925
  commission-rate: 0.0005
  minimum-commission: 5
  stamp-duty-rate: 0.0005
  transfer-fee-rate: 0
  slippage-bps: 5
  fallback-price-limit-rate: 0.10
  fee-version: CN_A_SHARE_ASSUMPTION_2026-09-25
  candidate-safety-margin-rate: 0.0010
  minimum-candidate-net-return-rate: 0.0020
  code-version: WORKTREE_UNCOMMITTED

# AI_GENERATE_END -----

models:
  # Java 使用 DJL + PyTorch Engine 完成 LSTM 训练、模型结构重建和在线推理。
  lstm:
    model-name: global-shared-lstm
    prediction:
      # 从当前日期开始向历史扫描缺失预测批次；0 表示关闭，最大值为 30。
      history-backfill-trading-days: ${LSTM_PREDICTION_HISTORY_BACKFILL_TRADING_DAYS:30}
      # 预测基准日或评估目标日行情覆盖率达到该阈值后才允许入队。
      min-price-coverage-rate: ${LSTM_PREDICTION_MIN_PRICE_COVERAGE_RATE:0.95}
    sequence-length: 60
    input-size: 56
    architecture-type: RANKING_LSTM
    random-seed: 20261023
    data-source: MODEL_FOUNDATION
    data-source-version: CURRENT
    benchmark-series-code: CSI300
    train-ratio: 0.8
    validation-gap: 2
    target-return-scale: 0.1
    max-panel-samples: 100000
    max-samples-per-stock: 80
    stock-embedding-buckets: 8192
    stock-embedding-size: 16
    industry-embedding-buckets: 512
    industry-embedding-size: 8
    group-head-count: 8
    market-embedding-size: 4
    residual-head-enabled: false
    group-head-scale: 0.1
    residual-head-scale: 0.1
    hidden-size: 50
    num-layers: 2
    dropout: 0.2
    epochs: 100
    batch-size: 32
    learning-rate: 0.001
    return-loss-weight: 0.5
    direction-loss-weight: 0.3
    downside-loss-weight: 0.2
    ranking-loss-weight: 0.45
    excess-return-loss-weight: 0.25
    cost-aware-direction-loss-weight: 0.15
    downside-quantile-loss-weight: 0.10
    consistency-loss-weight: 0.05
    cost-threshold: 0.002
    neutral-direction-weight: 0.25
    training-window-years: 3
    validation-window-months: 6
    test-window-months: 3
    walk-forward-step-months: 3
    purge-trading-days: 2
    embargo-trading-days: 20
    strict-isolation-trading-days: 60
    early-stopping: true
    patience: 10
    min-delta: 0.0001
  sentiment:
    train-ratio: 0.8
    max-sequence-length: 128
    calibration-temperature: ${FINBERT_CALIBRATION_TEMPERATURE:1.0}
    labels: [neutral, positive, negative]
    model-name: sentiment-finbert
    model-version: finbert-tone-chinese-e91b1a3a
    pretrained-model: yiyanghkust/finbert-tone-chinese
    model-path: ${SENTIMENT_MODEL_PATH:./model-files/sentiment}
    max-single-file-bytes: ${SENTIMENT_MAX_SINGLE_FILE_BYTES:2147483648}
    max-total-artifact-bytes: ${SENTIMENT_MAX_TOTAL_ARTIFACT_BYTES:4294967296}
  sentiment-shadow:
    enabled: ${MENGZI_SHADOW_ENABLED:false}
    model-name: ${MENGZI_MODEL_NAME:sentiment-mengzi}
    model-version: ${MENGZI_MODEL_VERSION:unconfigured}
    model-path: ${MENGZI_MODEL_PATH:./model-files/sentiment-mengzi}
    encoder-path: ${MENGZI_ENCODER_PATH:./model-files/sentiment-mengzi-encoder}
    encoder-version: ${MENGZI_ENCODER_VERSION:mengzi-bert-base-fin-3e525b4d}
    max-sequence-length: ${MENGZI_MAX_SEQUENCE_LENGTH:256}
    calibration-temperature: ${MENGZI_CALIBRATION_TEMPERATURE:1.0}
    batch-size: ${MENGZI_SHADOW_BATCH_SIZE:200}
    lookback-days: ${MENGZI_SHADOW_LOOKBACK_DAYS:7}
    minimum-shadow-trading-days: 20
    minimum-evaluated-samples: 500
    minimum-rank-ic: 0.02
    minimum-direction-accuracy: 0.52
    maximum-failure-rate: 0.01
    minimum-top-decile-net-return-improvement: 0.0
    minimum-output-std: 0.02
    rollback-window-trading-days: 10
    labels: [neutral, positive, negative]
  temporal-ensemble:
    master-shadow-enabled: ${MASTER_SHADOW_ENABLED:true}
    production-blend-enabled: ${TEMPORAL_ENSEMBLE_ENABLED:true}
    news-features-embedded: ${TEMPORAL_NEWS_FEATURES_EMBEDDED:true}
    news-feature-version: ${TEMPORAL_NEWS_FEATURE_VERSION:temporal-news-v1}
    initial-master-weight: 0.10
    rolling-window-trading-days: 20
    minimum-evaluated-trading-days: 10
    minimum-evaluated-samples: 500
    minimum-output-std: 0.01
    weight-advantage-multiplier: 2.0
    maximum-master-weight: 0.50

# 策略配置
strategy:
  decision:
    confidence-threshold: 0.7
    max-position-size: 10000
  selector:
    min-volume: 100000
    min-price: 5.0
    max-pe: 100
logging:
  level:
    root: INFO
    com.stock: INFO
    ai.djl: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
app:
  runtime:
    # 节点标识必须在共享数据库的不同运行节点之间保持唯一；未配置时使用主机名。
    node-id: ${APP_NODE_ID:}
    # 当前节点首次生成运行配置时使用的启动股票列表同步默认值。
    startup-data-sync-enabled: ${APP_STARTUP_DATA_SYNC_ENABLED:true}
    # 当前节点尚未生成运行配置时使用以下环境默认值；页面保存后以数据库值为准。
    news:
      # 新闻按发布时间保留的天数，0 表示不启用时间清理。
      retention-days: ${NEWS_RETENTION_DAYS:365}
      # 单只股票最多保留的新闻和公告总条数，0 表示不启用数量限制。
      max-records-per-stock: ${NEWS_MAX_RECORDS_PER_STOCK:300}
      collection-backfill:
        # 历史治理回填的 MongoDB 读取批次，任务默认暂停。
        batch-size: ${NEWS_COLLECTION_BACKFILL_BATCH_SIZE:500}
        # 单次任务最大处理量，达到后保留游标等待下一次运行。
        max-documents-per-run: ${NEWS_COLLECTION_BACKFILL_MAX_DOCUMENTS_PER_RUN:50000}
      collection-quality:
        # Rank IC 和扣成本收益 Gate 通过前禁止事件事实参与选股排名。
        ranking-enabled: ${NEWS_EVENT_RANKING_ENABLED:false}
        # 风险召回率和误报率 Gate 通过前禁止事件事实阻断交易候选。
        risk-gate-enabled: ${NEWS_EVENT_RISK_GATE_ENABLED:false}
  lstm:
    data-quality:
      minimum-training-stock-count: 100
      minimum-train-samples: 1000
      minimum-validation-samples: 200
      minimum-test-samples: 200
      minimum-walk-forward-fold-count: 3
      maximum-validation-loss: 1.0
      minimum-net-return: 0.0
      maximum-drawdown: 0.20
      minimum-initial-quality-score: 0.20
      minimum-quality-score-advantage: 0.05
      minimum-available-memory-mb: 256
      skip-training-codes: []

  # 证券平台 HTTP 代理（用于解决云服务器 IP 被 weixin.citicsinfo.com 拦截 403 的问题）
  # 当远程部署返回 403 而本地可访问时，在本地/可访问机器搭建代理，远程通过此配置转发请求
  securities:
    proxy:
      enabled: false
      host: 127.0.0.1
      port: 1080
      # 类型: HTTP 或 SOCKS5
      type: HTTP

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://stock-mysql:3306/stock_trading?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: stock
    password: ${MYSQL_PASSWORD}
  data:
    mongodb:
      uri: mongodb://admin:${MONGO_ROOT_PASSWORD}@stock-mongo:27017/stock_trading?authSource=admin
    redis:
      host: stock-redis
      port: 6379
      password: ${REDIS_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: true
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: false
