server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml

# AI_GENERATE_START -----
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: stock-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/stock_trading?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:stock}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:10}
      minimum-idle: ${MYSQL_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  main:
    allow-bean-definition-overriding: true
  data:
    mongodb:
      auto-index-creation: true
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://admin:${MONGO_ROOT_PASSWORD:}@${DATABASE_HOST:localhost}:27017/stock_trading?authSource=admin}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3s
      connect-timeout: 3s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  quartz:
    job-store-type: memory
    auto-startup: ${SPRING_QUARTZ_AUTO_STARTUP:true}
    startup-delay: 5s
    overwrite-existing-jobs: false
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: stock-trading-quartz
      org.quartz.scheduler.instanceId: NON_CLUSTERED
      org.quartz.threadPool.threadCount: 5
      org.quartz.jobStore.misfireThreshold: 60000

# ZX证券协议参数。默认关闭，真实值必须由运行环境注入。
zxbroker:
  enabled: ${ZXBROKER_ENABLED:false}
  mobile-code: ${ZXBROKER_MOBILE_CODE:}
  account: ${ZXBROKER_ACCOUNT:}
  encoded-password: ${ZXBROKER_ENCODED_PASSWORD:}

  captcha-auto-submit-enabled: ${ZXBROKER_CAPTCHA_AUTO_SUBMIT_ENABLED:false}
  ocr-timeout-ms: 20000
  ocr-request-interval-ms: 1050
  baidu-ocr-api-key: ${BAIDU_OCR_API_KEY:}
  baidu-ocr-secret-key: ${BAIDU_OCR_SECRET_KEY:}
  captcha-max-retries: 3
  sign-key: ${ZXBROKER_SIGN_KEY:}
  intact-to-server: ${ZXBROKER_INTACT_TO_SERVER:}
  token-expire-minutes: 30
  history-page-size: 500
  history-max-records-per-window: 5000
  history-request-interval-ms: 200

trading:
  # 自动真实交易固定参数；真实委托仍必须显式开启总门禁。
  real-write-enabled: ${TRADING_REAL_WRITE_ENABLED:false}
  history-month-interval-ms: 500
  auto-buy-amount: 1000
  auto-candidate-limit: 1
  take-profit-percent: 3
  force-exit-time: "14:50"

agent:
  enabled: true
  provider: ${AGENT_PROVIDER:deepseek}
  deepseek:
    enabled: true
    base-url: https://api.deepseek.com/v1
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    max-tokens: 1024
    thinking-enabled: false
    daily-budget:
      enabled: true
      daily-limit-cny: 1.00
      # 按高峰缓存未命中价格估算，并增加10%安全系数；价格变化时需同步调整。
      input-price-cny-per-million: 2.10
      output-price-cny-per-million: 8.40
      safety-factor: 1.10
      reservation-overhead-tokens: 1024
  ollama:
    enabled: false
    base-url: http://localhost:11434
    api-key: ollama
    model: deepseek-r1:7b
    think: false
    max-tokens: 256
  max-steps: 6
  max-model-rounds: 3
  timeout-ms: 120000
  max-output-chars: 12000
  max-concurrency: 1
  circuit-breaker-enabled: true
  circuit-breaker-failure-threshold: 1
  circuit-breaker-open-duration-ms: 60000
  report-enabled: false
  trade-plan-enabled: false
  rag-enabled: true
  memory-enabled: true
  rag-collection: agent_rag_chunks
  memory-default-ttl-days: 90
  chat-memory-max-messages: 20
  tool-timeout-ms: 5000
  audit-enabled: true
  vector-store: mongodb
  embedding:
    enabled: true
    provider: djl
    base-url: http://localhost:11434
    api-key: ollama
    model: bge-base-zh-v1.5
    model-path: ${EMBEDDING_MODEL_PATH:./model-artifacts/embedding}
    model-version: bge-base-zh-v1.5
    dimension: 768
    timeout-ms: 30000
    max-sequence-length: 512
    pooling-mode: cls
    normalize: true
    allow-hash-fallback: false

backtest:
  universe-limit: 500
  lookback-days: 5
  random-seed: 20260925
  commission-rate: 0.0005
  minimum-commission: 5
  stamp-duty-rate: 0.0005
  transfer-fee-rate: 0
  slippage-bps: 5
  fallback-price-limit-rate: 0.10
  fee-version: CN_A_SHARE_ASSUMPTION_2026-09-25
  candidate-safety-margin-rate: 0.0010
  minimum-candidate-net-return-rate: 0.0020
  code-version: WORKTREE_UNCOMMITTED

# AI_GENERATE_END -----

models:
  # Java 使用 DJL + PyTorch Engine 完成 LSTM 训练、模型结构重建和在线推理。
  lstm:
    model-name: global-shared-lstm
    prediction:
      # 从当前日期开始向历史扫描缺失预测批次；0 表示关闭，最大值为 30。
      history-backfill-trading-days: ${LSTM_PREDICTION_HISTORY_BACKFILL_TRADING_DAYS:30}
      # 预测基准日或评估目标日行情覆盖率达到该阈值后才允许入队。
      min-price-coverage-rate: ${LSTM_PREDICTION_MIN_PRICE_COVERAGE_RATE:0.95}
    sequence-length: 60
    input-size: 16
    train-ratio: 0.8
    validation-gap: 2
    target-return-scale: 0.1
    max-panel-samples: 100000
    max-samples-per-stock: 80
    stock-embedding-buckets: 8192
    stock-embedding-size: 16
    industry-embedding-buckets: 512
    industry-embedding-size: 8
    group-head-count: 8
    residual-head-enabled: true
    group-head-scale: 0.1
    residual-head-scale: 0.1
    hidden-size: 50
    num-layers: 2
    dropout: 0.2
    epochs: 100
    batch-size: 32
    learning-rate: 0.001
    return-loss-weight: 0.5
    direction-loss-weight: 0.3
    downside-loss-weight: 0.2
    early-stopping: true
    patience: 10
    min-delta: 0.0001
  sentiment:
    train-ratio: 0.8
    max-sequence-length: 128
    labels: [neutral, positive, negative]
    model-name: sentiment-finbert
    model-version: finbert-tone-chinese-e91b1a3a
    pretrained-model: yiyanghkust/finbert-tone-chinese
    model-path: ${SENTIMENT_MODEL_PATH:./model-artifacts/sentiment}
    max-single-file-bytes: ${SENTIMENT_MAX_SINGLE_FILE_BYTES:2147483648}
    max-total-artifact-bytes: ${SENTIMENT_MAX_TOTAL_ARTIFACT_BYTES:4294967296}

# 策略配置
strategy:
  decision:
    confidence-threshold: 0.7
    max-position-size: 10000
  selector:
    min-volume: 100000
    min-price: 5.0
    max-pe: 100
logging:
  level:
    root: INFO
    com.stock: INFO
    ai.djl: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
app:
  runtime:
    # 节点标识必须在共享数据库的不同运行节点之间保持唯一；未配置时使用主机名。
    node-id: ${APP_NODE_ID:}
    # 当前节点首次生成运行配置时使用的启动股票列表同步默认值。
    startup-data-sync-enabled: ${APP_STARTUP_DATA_SYNC_ENABLED:true}
    # 当前节点尚未生成运行配置时使用以下环境默认值；页面保存后以数据库值为准。
    news:
      # 新闻按发布时间保留的天数，0 表示不启用时间清理。
      retention-days: ${NEWS_RETENTION_DAYS:365}
      # 单只股票最多保留的新闻和公告总条数，0 表示不启用数量限制。
      max-records-per-stock: ${NEWS_MAX_RECORDS_PER_STOCK:300}
  lstm:
    data-quality:
      minimum-training-stock-count: 100
      minimum-train-samples: 1000
      minimum-validation-samples: 200
      maximum-validation-loss: 1.0
      minimum-available-memory-mb: 256
      skip-training-codes: []

  # 证券平台 HTTP 代理（用于解决云服务器 IP 被 weixin.citicsinfo.com 拦截 403 的问题）
  # 当远程部署返回 403 而本地可访问时，在本地/可访问机器搭建代理，远程通过此配置转发请求
  securities:
    proxy:
      enabled: false
      host: 127.0.0.1
      port: 1080
      # 类型: HTTP 或 SOCKS5
      type: HTTP

