spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: stock-backend
  datasource:
    url: jdbc:mysql://117.72.216.67:6033/stock_trading?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: "${MYSQL_MAX_POOL_SIZE:10}"
      minimum-idle: "${MYSQL_MIN_IDLE:2}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  flyway:
    enabled: false
  main:
    allow-bean-definition-overriding: true
  data:
    mongodb:
      auto-index-creation: true
      uri: "mongodb://admin:${DATABASE_PASSWORD}@117.72.216.67:27017/stock_trading?authSource=admin"
    redis:
      host: 117.72.216.67
      password: "${DATABASE_PASSWORD}"
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
  session:
    store-type: redis
    redis:
      namespace: "stock:session"
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: Asia/Shanghai
  quartz:
    auto-startup: ${SPRING_QUARTZ_AUTO_STARTUP:true}
    startup-delay: 5s
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: stock-trading-quartz
      org.quartz.threadPool.threadCount: 5

server:
  servlet:
    session:
      timeout: ${HTTP_SESSION_TIMEOUT:8h}
      cookie:
        name: STOCK_SESSION
        secure: "${HTTP_SESSION_COOKIE_SECURE:false}"
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml

zxbroker:
  enabled: true
  mobile-code: ${ZXBROKER_MOBILE_CODE:}
  account: ${ZXBROKER_ACCOUNT:}
  encoded-password: ${ZXBROKER_ENCODED_PASSWORD:}
  captcha-auto-submit-enabled: true
  baidu-ocr-api-key: ${BAIDU_OCR_API_KEY:}
  baidu-ocr-secret-key: ${BAIDU_OCR_SECRET_KEY:}
  sign-key: ${ZXBROKER_SIGN_KEY:}
  intact-to-server: ${ZXBROKER_INTACT_TO_SERVER:}

trading:
  real-write-enabled: false
internal:
  api:
    token: "${INTERNAL_API_TOKEN:}"

models:
  lstm:
    input-size: 56
    residual-head-enabled: false
  sentiment:
    model-version: finbert-tone-chinese-e91b1a3a
  sentiment-shadow:
    enabled: ${MENGZI_SHADOW_ENABLED:false}
    encoder-version: ${MENGZI_ENCODER_VERSION:mengzi-bert-base-fin-3e525b4d}
  temporal-ensemble:
    master-shadow-enabled: ${MASTER_SHADOW_ENABLED:true}
    production-blend-enabled: ${TEMPORAL_ENSEMBLE_ENABLED:true}
    news-features-embedded: ${TEMPORAL_NEWS_FEATURES_EMBEDDED:true}
    news-feature-version: ${TEMPORAL_NEWS_FEATURE_VERSION:temporal-news-v1}

app:
  runtime:
    node-id: ${APP_NODE_ID:}
    startup-data-sync-enabled: ${APP_STARTUP_DATA_SYNC_ENABLED:true}
    news:
      external:
        enabled: ${NEWS_EXTERNAL_SOURCES_ENABLED:false}
        csrc-enabled: ${NEWS_EXTERNAL_CSRC_ENABLED:false}
      collection-quality:
        ranking-enabled: ${NEWS_EVENT_RANKING_ENABLED:false}
        risk-gate-enabled: ${NEWS_EVENT_RISK_GATE_ENABLED:false}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://stock-mysql:3306/stock_trading?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: stock
  flyway:
    enabled: true
  data:
    mongodb:
      uri: "mongodb://admin:${DATABASE_PASSWORD}@stock-mongo:27017/stock_trading?authSource=admin"
    redis:
      host: stock-redis
