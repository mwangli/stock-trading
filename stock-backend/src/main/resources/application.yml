server:
  port: 8080

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: stock-trading
  main:
    allow-bean-definition-overriding: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  # MySQL配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DATABASE_HOST:localhost}:6033/stock_trading?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${MYSQL_ROOT_PASSWORD:}
  data:
    mongodb:
      auto-index-creation: true
      host: ${DATABASE_HOST:localhost}
      port: 27017
      database: stock_trading
      authentication-database: admin
      username: admin
      password: ${MONGO_ROOT_PASSWORD:}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# 中信证券协议参数。默认关闭，真实值必须由运行环境注入。
zxbroker:
  enabled: ${ZXBROKER_ENABLED:false}
  mobile-code: ${ZXBROKER_MOBILE_CODE:}
  account: ${ZXBROKER_ACCOUNT:}
  encoded-password: ${ZXBROKER_ENCODED_PASSWORD:}

  captcha-auto-submit-enabled: ${ZXBROKER_CAPTCHA_AUTO_SUBMIT_ENABLED:false}
  ocr-timeout-ms: 20000
  ocr-request-interval-ms: 1050
  baidu-ocr-api-key: ${BAIDU_OCR_API_KEY:}
  baidu-ocr-secret-key: ${BAIDU_OCR_SECRET_KEY:}
  captcha-max-retries: 3
  sign-key: ${ZXBROKER_SIGN_KEY:}
  intact-to-server: ${ZXBROKER_INTACT_TO_SERVER:}
  token-expire-minutes: 30
  history-page-size: 500
  history-max-records-per-window: 5000
  history-request-interval-ms: 200

trading:
  # 自动真实交易固定参数；真实委托仍必须显式开启总门禁。
  real-write-enabled: ${TRADING_REAL_WRITE_ENABLED:false}
  history-month-interval-ms: 500
  auto-buy-amount: 1000
  auto-candidate-limit: 1
  take-profit-percent: 3
  force-exit-time: "14:50"

backtest:
  universe-limit: 500
  lookback-days: 5
  random-seed: 20260925
  commission-rate: 0.0005
  minimum-commission: 5
  stamp-duty-rate: 0.0005
  transfer-fee-rate: 0
  slippage-bps: 5
  fallback-price-limit-rate: 0.10
  fee-version: CN_A_SHARE_ASSUMPTION_2026-09-25
  code-version: WORKTREE_UNCOMMITTED

models:
  # Java 使用 DJL + PyTorch Engine 完成 LSTM 训练、模型结构重建和在线推理。
  lstm:
    model-name: global-shared-lstm
    sequence-length: 60
    input-size: 16
    train-ratio: 0.8
    validation-gap: 2
    target-return-scale: 0.1
    max-panel-samples: 100000
    max-samples-per-stock: 80
    stock-embedding-buckets: 8192
    stock-embedding-size: 16
    industry-embedding-buckets: 512
    industry-embedding-size: 8
    group-head-count: 8
    residual-head-enabled: true
    group-head-scale: 0.1
    residual-head-scale: 0.1
    training-enabled: ${LSTM_TRAINING_ENABLED:false}
    hidden-size: 50
    num-layers: 2
    dropout: 0.2
    epochs: 100
    batch-size: 32
    learning-rate: 0.001
    return-loss-weight: 0.5
    direction-loss-weight: 0.3
    downside-loss-weight: 0.2
    early-stopping: true
    patience: 10
    min-delta: 0.0001
  sentiment:
    train-ratio: 0.8
    max-sequence-length: 128
    labels: [neutral, positive, negative]
    model-name: sentiment-finbert
    model-version: local-current
    model-source: local
    model-path: ${SENTIMENT_MODEL_PATH:./models/sentiment}
    pretrained-model: ProsusAI/finbert
    download-pretrained: false

# 策略配置
strategy:
  decision:
    confidence-threshold: 0.7
    max-position-size: 10000
  selector:
    min-volume: 100000
    min-price: 5.0
    max-pe: 100
logging:
  level:
    root: INFO
    com.stock: INFO
    ai.djl: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
app:
  startup:
    history-sync:
      enabled: false  # 重任务由统一调度中心按需执行
    # 新闻采集开关：启动时遍历所有股票，先采集标题再获取详情写入数据库
    news-sync:
      enabled: false
  # 证券平台 HTTP 代理（用于解决云服务器 IP 被 weixin.citicsinfo.com 拦截 403 的问题）
  # 当远程部署返回 403 而本地可访问时，在本地/可访问机器搭建代理，远程通过此配置转发请求
  securities:
    proxy:
      enabled: false
      host: 127.0.0.1
      port: 1080
      # 类型: HTTP 或 SOCKS5
      type: HTTP

