name: Release Wheel

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: stock-trading-wheel-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate release
        shell: bash
        run: |
          git fetch origin stock-trading --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"

          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$project_version"

          systemd_dir=.github/systemd
          tasks="sell buy collect rank broker perform evaluate clean"
          test -f "$systemd_dir/stock@.service"
          test "$(find "$systemd_dir" -maxdepth 1 -name 'stock-*.timer' -type f | wc -l)" -eq 8
          grep -Fq 'EnvironmentFile=/etc/stock-trading/env' "$systemd_dir/stock@.service"
          grep -Fq 'ExecStart=__DEPLOY_DIR__/venv/bin/stock-%i' "$systemd_dir/stock@.service"
          grep -Fq 'StandardOutput=journal' "$systemd_dir/stock@.service"
          grep -Fq 'StandardError=journal' "$systemd_dir/stock@.service"
          ! grep -ERq 'flock|Restart=|sleep 300' "$systemd_dir"
          for task in $tasks; do
            timer="$systemd_dir/stock-$task.timer"
            test -f "$timer"
            grep -Fq "Unit=stock@$task.service" "$timer"
            grep -Fq "stock-$task =" pyproject.toml
          done
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 09:35:00 Asia/Shanghai' "$systemd_dir/stock-sell.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 13:05:00 Asia/Shanghai' "$systemd_dir/stock-buy.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 16:30:00 Asia/Shanghai' "$systemd_dir/stock-collect.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 17:00:00 Asia/Shanghai' "$systemd_dir/stock-rank.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 20:20:00 Asia/Shanghai' "$systemd_dir/stock-broker.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 20:30:00 Asia/Shanghai' "$systemd_dir/stock-perform.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 20:35:00 Asia/Shanghai' "$systemd_dir/stock-evaluate.timer"
          grep -Fq 'OnCalendar=Sun *-*-* 03:00:00 Asia/Shanghai' "$systemd_dir/stock-clean.timer"
          grep -Fq '_run("stock-sell", ["trading", "--type", "S"])' src/stock_trading/shortcuts.py
          grep -Fq '_run("stock-buy", ["trading", "--type", "B"])' src/stock_trading/shortcuts.py
          grep -Fq '_run("stock-perform", ["performance"])' src/stock_trading/shortcuts.py
          test ! -e .github/config

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Upload release files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          source: "dist/*.whl,.github/systemd/*"
          target: ${{ format('{0}/releases/{1}', vars.SERVER_DEPLOY_DIR, github.ref_name) }}
          strip_components: 1
          overwrite: true

      - name: Install release and timers
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_DIR: ${{ vars.SERVER_DEPLOY_DIR }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          envs: DEPLOY_DIR,RELEASE_TAG
          command_timeout: 60m
          script: |
            set -eu
            deploy_dir="${DEPLOY_DIR%/}"
            release_dir="$deploy_dir/releases/$RELEASE_TAG"
            venv_dir="$deploy_dir/venv"
            systemd_source="$release_dir/systemd"
            systemd_target=/etc/systemd/system
            timers="stock-sell.timer stock-buy.timer stock-collect.timer stock-rank.timer stock-broker.timer stock-perform.timer stock-evaluate.timer stock-clean.timer"

            if [ ! -s /etc/stock-trading/env ] || [ ! -r /etc/stock-trading/env ]; then
              echo "Missing or unreadable environment file: /etc/stock-trading/env" >&2
              exit 1
            fi
            command -v systemctl >/dev/null

            set -- "$release_dir"/*.whl
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "Expected exactly one wheel in $release_dir" >&2
              exit 1
            fi
            wheel="$1"

            export UV_DEFAULT_INDEX="https://mirrors.aliyun.com/pypi/simple/"
            export UV_HTTP_TIMEOUT=300
            export UV_HTTP_RETRIES=5
            export PATH="$HOME/.local/bin:$PATH"
            uv python install 3.12
            uv venv --allow-existing --managed-python --python 3.12 "$venv_dir"
            uv pip install --python "$venv_dir/bin/python" --upgrade "$wheel"

            mkdir -p \
              /data/stock-trading/market \
              /data/stock-trading/qlib \
              /data/stock-trading/artifacts \
              /data/stock-trading/state

            sed "s|__DEPLOY_DIR__|$deploy_dir|g" \
              "$systemd_source/stock@.service" \
              > "$systemd_target/stock@.service"
            chmod 0644 "$systemd_target/stock@.service"
            for timer in $timers; do
              install -m 0644 "$systemd_source/$timer" "$systemd_target/$timer"
            done
            rm -f /etc/logrotate.d/stock-trading

            if command -v crontab >/dev/null; then
              current_cron="$(mktemp)"
              cleaned_cron="$(mktemp)"
              crontab -l > "$current_cron" 2>/dev/null || true
              awk '
                $0 == "# STOCK_TRADING_CRON_BEGIN" { managed = 1; next }
                $0 == "# STOCK_TRADING_CRON_END" { managed = 0; next }
                !managed { print }
              ' "$current_cron" > "$cleaned_cron"
              crontab "$cleaned_cron"
              rm -f "$current_cron" "$cleaned_cron"
            fi
            rm -f \
              "$deploy_dir/cron/stock-trading.cron" \
              "$deploy_dir/cron/stock-trading.logrotate" \
              /data/stock-trading/state/scheduler.lock \
              /data/stock-trading/state/logrotate.status
            rmdir "$deploy_dir/cron" 2>/dev/null || true

            systemctl disable --now 'stock-trading-*.timer' 2>/dev/null || true
            rm -f "$systemd_target"/stock-trading-*.timer "$systemd_target"/stock-trading-*.service
            systemctl daemon-reload
            systemctl enable --now $timers

            for timer in $timers; do
              systemctl is-enabled --quiet "$timer"
              systemctl is-active --quiet "$timer"
            done
            systemctl list-timers --all $timers --no-pager
