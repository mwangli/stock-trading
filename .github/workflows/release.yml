name: Release Wheel

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: stock-trading-wheel-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build release
        run: |
          git fetch origin stock-trading --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          python -m pip install build
          python -m build --wheel

      - name: Upload release files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          source: "dist/*.whl,.github/stock-trading.cron,.github/stock-trading.logrotate"
          target: ${{ format('~/stock-trading/releases/{0}', github.ref_name) }}
          strip_components: 1
          overwrite: true

      - name: Install release and cron
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          envs: RELEASE_TAG
          command_timeout: 60m
          script: |
            set -eu
            project_dir="$HOME/stock-trading"
            release_dir="$project_dir/releases/$RELEASE_TAG"
            venv_dir="$project_dir/venv"
            python_dir="$project_dir/python"
            uv_cache_dir="$project_dir/.uv-cache"
            env_file="$project_dir/.env"
            data_dir="$project_dir/data"
            logs_dir="$project_dir/logs"
            cron_template="$release_dir/stock-trading.cron"
            logrotate_template="$release_dir/stock-trading.logrotate"
            cron_dir="$project_dir/cron"
            cron_file="$cron_dir/stock-trading.cron"
            logrotate_file="$cron_dir/stock-trading.logrotate"
            commands="stock-help stock-init stock-train stock-collect stock-rank stock-sell stock-buy stock-broker stock-perform stock-evaluate stock-clean"

            if [ ! -s "$env_file" ] || [ ! -r "$env_file" ]; then
              echo "Missing or unreadable project environment file: $env_file" >&2
              exit 1
            fi

            set -- "$release_dir"/*.whl
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "Expected exactly one wheel in $release_dir" >&2
              exit 1
            fi
            wheel="$1"

            mkdir -p \
              "$python_dir" \
              "$uv_cache_dir" \
              "$data_dir/market" \
              "$data_dir/qlib" \
              "$data_dir/artifacts" \
              "$data_dir/state" \
              "$cron_dir" \
              "$logs_dir"

            export UV_DEFAULT_INDEX="https://mirrors.aliyun.com/pypi/simple/"
            export UV_HTTP_TIMEOUT=300
            export UV_HTTP_RETRIES=5
            export UV_PYTHON_INSTALL_DIR="$python_dir"
            export UV_CACHE_DIR="$uv_cache_dir"
            export PATH="$HOME/.local/bin:$PATH"
            command -v uv >/dev/null
            command -v crontab >/dev/null
            command -v flock >/dev/null
            command -v logrotate >/dev/null
            command -v setsid >/dev/null
            uv python install 3.12
            uv venv --clear --managed-python --python 3.12 "$venv_dir"
            uv pip install --python "$venv_dir/bin/python" --upgrade "$wheel"

            installed_version="$("$venv_dir/bin/python" -c 'import importlib.metadata; print(importlib.metadata.version("stock-trading"))')"
            test "$RELEASE_TAG" = "v$installed_version"
            configured_project_dir="$("$venv_dir/bin/python" -c 'from stock_trading.config import AppConfig; print(AppConfig.from_env().project_dir)')"
            test "$configured_project_dir" = "$project_dir"
            for command_name in $commands; do
              test -x "$venv_dir/bin/$command_name"
            done

            touch "$logs_dir/stock-trading.log" "$data_dir/state/scheduler.lock"

            sed \
              -e "s|__PROJECT_DIR__|$project_dir|g" \
              -e "s|__SYSTEM_PATH__|$PATH|g" \
              "$cron_template" \
              > "$cron_file"
            sed "s|__PROJECT_DIR__|$project_dir|g" "$logrotate_template" > "$logrotate_file"

            current_cron="$cron_dir/.current.cron.tmp"
            next_cron="$cron_dir/.next.cron.tmp"
            installed_cron="$cron_dir/.installed.cron.tmp"
            trap 'rm -f "$current_cron" "$next_cron" "$installed_cron"' EXIT
            crontab -l > "$current_cron" 2>/dev/null || true
            awk '
              $0 == "# STOCK_TRADING_CRON_BEGIN" { managed = 1; next }
              $0 == "# STOCK_TRADING_CRON_END" { managed = 0; next }
              !managed { print }
            ' "$current_cron" > "$next_cron"
            cat "$cron_file" >> "$next_cron"
            crontab "$next_cron"
            crontab -l | awk '
              $0 == "# STOCK_TRADING_CRON_BEGIN" { managed = 1 }
              managed { print }
              $0 == "# STOCK_TRADING_CRON_END" { exit }
            ' > "$installed_cron"
            cmp "$cron_file" "$installed_cron"

            log_file="$logs_dir/stock-trading.log"
            runtime_path="$venv_dir/bin:$PATH"
            printf '[%s] release stock-init triggered\n' \
              "$(date '+%Y-%m-%d %H:%M:%S%z')" >> "$log_file"
            nohup setsid env -i \
              HOME="$HOME" \
              PATH="$runtime_path" \
              LANG="${LANG:-C.UTF-8}" \
              TZ="Asia/Shanghai" \
              flock "$data_dir/state/scheduler.lock" \
              bash -c 'set -e; cd "$1"; exec "$2"' \
              _ "$project_dir" "$venv_dir/bin/stock-init" \
              >> "$log_file" 2>&1 < /dev/null &
            init_pid=$!
            kill -0 "$init_pid"
            printf '[%s] release stock-init launched pid=%s\n' \
              "$(date '+%Y-%m-%d %H:%M:%S%z')" "$init_pid" >> "$log_file"
