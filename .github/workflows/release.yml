name: Release Wheel

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: stock-trading-wheel-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate release
        shell: bash
        run: |
          git fetch origin stock-trading --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"

          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$project_version"

          tasks="sell buy collect rank broker perform evaluate clean"
          cron_file=.github/stock-trading.cron
          logrotate_file=.github/stock-trading.logrotate
          test ! -e .github/systemd
          test "$(grep -c '^# STOCK_TRADING_CRON_BEGIN$' "$cron_file")" -eq 1
          test "$(grep -c '^# STOCK_TRADING_CRON_END$' "$cron_file")" -eq 1
          grep -Fq 'CRON_TZ=Asia/Shanghai' "$cron_file"
          grep -Fq 'LOG=__PROJECT_DIR__/data/stock-trading.log' "$cron_file"
          grep -Fq 'LOCK=__PROJECT_DIR__/data/state/scheduler.lock' "$cron_file"
          for task in $tasks; do
            test "$(grep -c "exec stock-$task'" "$cron_file")" -eq 1
            grep -Fq "stock-$task =" pyproject.toml
          done
          grep -Fq 'stock-init = "stock_trading.shortcuts:init"' pyproject.toml
          grep -Fq 'stock-train = "stock_trading.shortcuts:train"' pyproject.toml
          grep -Fq 'stock-help = "stock_trading.shortcuts:show_help"' pyproject.toml
          ! grep -Fq 'stock-trading =' pyproject.toml
          grep -Fq '35 9 * * 1-5' "$cron_file"
          grep -Fq '5 13 * * 1-5' "$cron_file"
          grep -Fq '30 16 * * 1-5' "$cron_file"
          grep -Fq '0 17 * * 1-5' "$cron_file"
          grep -Fq '20 20 * * 1-5' "$cron_file"
          grep -Fq '30 20 * * 1-5' "$cron_file"
          grep -Fq '35 20 * * 1-5' "$cron_file"
          grep -Fq '0 3 * * 0' "$cron_file"
          grep -Fq '/usr/sbin/logrotate' "$cron_file"
          grep -Fq '__PROJECT_DIR__/data/stock-trading.log {' "$logrotate_file"
          grep -Fq '"stock-init",' src/stock_trading/shortcuts.py
          grep -Fq '"stock-train",' src/stock_trading/shortcuts.py
          grep -Fq '"stock-help",' src/stock_trading/shortcuts.py
          grep -Fq '"stock-sell",' src/stock_trading/shortcuts.py
          grep -Fq '"stock-buy",' src/stock_trading/shortcuts.py
          grep -Fq 'HELP_CONTEXT = {"help_option_names": ["-h", "--help"]}' src/stock_trading/shortcuts.py
          test ! -e .github/config

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Upload release files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          source: "dist/*.whl,.github/stock-trading.cron,.github/stock-trading.logrotate"
          target: ${{ format('~/stock-trading/releases/{0}', github.ref_name) }}
          strip_components: 1
          overwrite: true

      - name: Install release and cron
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          envs: RELEASE_TAG
          command_timeout: 60m
          script: |
            set -eu
            project_dir="$HOME/stock-trading"
            release_dir="$project_dir/releases/$RELEASE_TAG"
            venv_dir="$project_dir/venv"
            env_file="$project_dir/.env"
            data_dir="$project_dir/data"
            cron_template="$release_dir/stock-trading.cron"
            logrotate_template="$release_dir/stock-trading.logrotate"
            cron_dir="$project_dir/cron"
            cron_file="$cron_dir/stock-trading.cron"
            logrotate_file="$cron_dir/stock-trading.logrotate"
            tasks="sell buy collect rank broker perform evaluate clean"
            commands="stock-help stock-init stock-train stock-sell stock-buy stock-collect stock-rank stock-broker stock-perform stock-evaluate stock-clean"

            if [ ! -e "$env_file" ] && [ -s /etc/stock-trading/env ] && [ -r /etc/stock-trading/env ]; then
              install -m 0600 /etc/stock-trading/env "$env_file"
            fi
            if [ ! -s "$env_file" ] || [ ! -r "$env_file" ]; then
              echo "Missing or unreadable environment file: $env_file" >&2
              exit 1
            fi
            command -v crontab >/dev/null
            command -v flock >/dev/null
            command -v logrotate >/dev/null

            set -- "$release_dir"/*.whl
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "Expected exactly one wheel in $release_dir" >&2
              exit 1
            fi
            wheel="$1"

            export UV_DEFAULT_INDEX="https://mirrors.aliyun.com/pypi/simple/"
            export UV_HTTP_TIMEOUT=300
            export UV_HTTP_RETRIES=5
            export PATH="$HOME/.local/bin:$PATH"
            uv python install 3.12
            uv venv --allow-existing --managed-python --python 3.12 "$venv_dir"
            uv pip install --python "$venv_dir/bin/python" --upgrade "$wheel"

            for command_name in $commands; do
              if [ ! -x "$venv_dir/bin/$command_name" ]; then
                echo "Missing installed command: $venv_dir/bin/$command_name" >&2
                exit 1
              fi
            done

            mkdir -p \
              "$data_dir/market" \
              "$data_dir/qlib" \
              "$data_dir/artifacts" \
              "$data_dir/state" \
              "$cron_dir"
            touch "$data_dir/stock-trading.log" "$data_dir/state/scheduler.lock"

            sed "s|__PROJECT_DIR__|$project_dir|g" "$cron_template" > "$cron_file"
            sed "s|__PROJECT_DIR__|$project_dir|g" "$logrotate_template" > "$logrotate_file"

            current_cron="$(mktemp)"
            next_cron="$(mktemp)"
            installed_cron="$(mktemp)"
            trap 'rm -f "$current_cron" "$next_cron" "$installed_cron"' EXIT
            crontab -l > "$current_cron" 2>/dev/null || true
            awk '
              $0 == "# STOCK_TRADING_CRON_BEGIN" { managed = 1; next }
              $0 == "# STOCK_TRADING_CRON_END" { managed = 0; next }
              !managed { print }
            ' "$current_cron" > "$next_cron"
            cat "$cron_file" >> "$next_cron"
            crontab "$next_cron"
            crontab -l | awk '
              $0 == "# STOCK_TRADING_CRON_BEGIN" { managed = 1 }
              managed { print }
              $0 == "# STOCK_TRADING_CRON_END" { exit }
            ' > "$installed_cron"
            cmp "$cron_file" "$installed_cron"

            if command -v systemctl >/dev/null 2>&1; then
              for task in $tasks; do
                systemctl disable --now "stock-$task.timer" 2>/dev/null || true
                rm -f "/etc/systemd/system/stock-$task.timer"
                rm -f "/etc/systemd/system/stock-$task.service"
              done
              rm -f /etc/systemd/system/stock@.service
              systemctl daemon-reload
            fi
