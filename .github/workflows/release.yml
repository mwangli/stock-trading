name: Release Wheel

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: stock-trading-wheel-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate release
        shell: bash
        run: |
          git fetch origin stock-trading --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"

          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$project_version"

          systemd_dir=.github/systemd
          tasks="sell buy collect rank broker perform evaluate clean"
          test "$(find "$systemd_dir" -maxdepth 1 -name 'stock-*.service' -type f | wc -l)" -eq 8
          test "$(find "$systemd_dir" -maxdepth 1 -name 'stock-*.timer' -type f | wc -l)" -eq 8
          test ! -e "$systemd_dir/stock@.service"
          ! grep -ERq 'flock|Restart=|sleep 300' "$systemd_dir"
          for task in $tasks; do
            service="$systemd_dir/stock-$task.service"
            timer="$systemd_dir/stock-$task.timer"
            test -f "$service"
            test -f "$timer"
            grep -Fq 'EnvironmentFile=__PROJECT_DIR__/.env' "$service"
            grep -Fq "ExecStart=__PROJECT_DIR__/venv/bin/stock-$task" "$service"
            grep -Fq 'StandardOutput=journal' "$service"
            grep -Fq 'StandardError=journal' "$service"
            grep -Fq "Unit=stock-$task.service" "$timer"
            grep -Fq "stock-$task =" pyproject.toml
          done
          grep -Fq 'stock-init = "stock_trading.shortcuts:init"' pyproject.toml
          grep -Fq 'stock-train = "stock_trading.shortcuts:train"' pyproject.toml
          grep -Fq 'stock-help = "stock_trading.shortcuts:show_help"' pyproject.toml
          ! grep -Fq 'stock-trading =' pyproject.toml
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 09:35:00 Asia/Shanghai' "$systemd_dir/stock-sell.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 13:05:00 Asia/Shanghai' "$systemd_dir/stock-buy.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 16:30:00 Asia/Shanghai' "$systemd_dir/stock-collect.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 17:00:00 Asia/Shanghai' "$systemd_dir/stock-rank.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 20:20:00 Asia/Shanghai' "$systemd_dir/stock-broker.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 20:30:00 Asia/Shanghai' "$systemd_dir/stock-perform.timer"
          grep -Fq 'OnCalendar=Mon..Fri *-*-* 20:35:00 Asia/Shanghai' "$systemd_dir/stock-evaluate.timer"
          grep -Fq 'OnCalendar=Sun *-*-* 03:00:00 Asia/Shanghai' "$systemd_dir/stock-clean.timer"
          grep -Fq '"stock-init",' src/stock_trading/shortcuts.py
          grep -Fq '"stock-train",' src/stock_trading/shortcuts.py
          grep -Fq '"stock-help",' src/stock_trading/shortcuts.py
          grep -Fq '"stock-sell",' src/stock_trading/shortcuts.py
          grep -Fq '"stock-buy",' src/stock_trading/shortcuts.py
          grep -Fq 'HELP_CONTEXT = {"help_option_names": ["-h", "--help"]}' src/stock_trading/shortcuts.py
          test ! -e .github/config

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Upload release files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          source: "dist/*.whl,.github/systemd/*"
          target: ${{ format('~/stock-trading/releases/{0}', github.ref_name) }}
          strip_components: 1
          overwrite: true

      - name: Install release and timers
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          envs: RELEASE_TAG
          command_timeout: 60m
          script: |
            set -eu
            project_dir="$HOME/stock-trading"
            release_dir="$project_dir/releases/$RELEASE_TAG"
            venv_dir="$project_dir/venv"
            env_file="$project_dir/.env"
            data_dir="$project_dir/data"
            systemd_source="$release_dir/systemd"
            systemd_target=/etc/systemd/system
            services="stock-sell.service stock-buy.service stock-collect.service stock-rank.service stock-broker.service stock-perform.service stock-evaluate.service stock-clean.service"
            timers="stock-sell.timer stock-buy.timer stock-collect.timer stock-rank.timer stock-broker.timer stock-perform.timer stock-evaluate.timer stock-clean.timer"
            commands="stock-help stock-init stock-train stock-sell stock-buy stock-collect stock-rank stock-broker stock-perform stock-evaluate stock-clean"

            if [ ! -e "$env_file" ] && [ -s /etc/stock-trading/env ] && [ -r /etc/stock-trading/env ]; then
              install -m 0600 /etc/stock-trading/env "$env_file"
            fi
            if [ ! -s "$env_file" ] || [ ! -r "$env_file" ]; then
              echo "Missing or unreadable environment file: $env_file" >&2
              exit 1
            fi
            command -v systemctl >/dev/null

            set -- "$release_dir"/*.whl
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "Expected exactly one wheel in $release_dir" >&2
              exit 1
            fi
            wheel="$1"

            export UV_DEFAULT_INDEX="https://mirrors.aliyun.com/pypi/simple/"
            export UV_HTTP_TIMEOUT=300
            export UV_HTTP_RETRIES=5
            export PATH="$HOME/.local/bin:$PATH"
            uv python install 3.12
            uv venv --allow-existing --managed-python --python 3.12 "$venv_dir"
            uv pip install --python "$venv_dir/bin/python" --upgrade "$wheel"

            for command_name in $commands; do
              if [ ! -x "$venv_dir/bin/$command_name" ]; then
                echo "Missing installed command: $venv_dir/bin/$command_name" >&2
                exit 1
              fi
            done

            mkdir -p \
              "$data_dir/market" \
              "$data_dir/qlib" \
              "$data_dir/artifacts" \
              "$data_dir/state"

            for service in $services; do
              sed "s|__PROJECT_DIR__|$project_dir|g" \
                "$systemd_source/$service" \
                > "$systemd_target/$service"
              chmod 0644 "$systemd_target/$service"
            done
            for timer in $timers; do
              install -m 0644 "$systemd_source/$timer" "$systemd_target/$timer"
            done
            rm -f "$systemd_target/stock@.service"
            systemctl daemon-reload
            systemctl enable --now $timers

            for timer in $timers; do
              systemctl is-enabled --quiet "$timer"
              systemctl is-active --quiet "$timer"
            done
            systemctl list-timers --all $timers --no-pager
