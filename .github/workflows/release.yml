name: Release Wheel

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: stock-trading-wheel-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build release
        run: |
          git fetch origin stock-trading --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          python -m pip install build
          python -m build --wheel

      - name: Upload release files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          source: "dist/*.whl,.github/stock-trading.cron,.github/stock-trading.logrotate"
          target: ${{ format('/home/root/stock-trading/releases/{0}', github.ref_name) }}
          strip_components: 1
          overwrite: true

      - name: Install release and cron
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          envs: RELEASE_TAG
          command_timeout: 60m
          script: |
            set -eu
            project_dir=/home/root/stock-trading
            release_dir="$project_dir/releases/$RELEASE_TAG"
            venv_dir="$project_dir/venv"
            data_dir="$project_dir/data"
            logs_dir="$project_dir/logs"
            cron_template="$release_dir/stock-trading.cron"
            logrotate_template="$release_dir/stock-trading.logrotate"
            cron_dir="$project_dir/cron"
            cron_file="$cron_dir/stock-trading.cron"
            logrotate_file="$cron_dir/stock-trading.logrotate"

            export UV_DEFAULT_INDEX="https://mirrors.aliyun.com/pypi/simple/"
            export UV_HTTP_TIMEOUT=300
            export UV_HTTP_RETRIES=5
            export PATH="/home/root/.local/bin:$PATH"
            uv venv --allow-existing --managed-python --python 3.12 "$venv_dir"
            uv pip install --python "$venv_dir/bin/python" --upgrade "$release_dir"/*.whl

            mkdir -p \
              "$data_dir/state" \
              "$cron_dir" \
              "$logs_dir"
            touch "$logs_dir/stock-trading.log" "$data_dir/state/scheduler.lock"

            sed "s|__PROJECT_DIR__|$project_dir|g" "$cron_template" > "$cron_file"
            sed "s|__PROJECT_DIR__|$project_dir|g" "$logrotate_template" > "$logrotate_file"

            current_cron="$(mktemp)"
            next_cron="$(mktemp)"
            trap 'rm -f "$current_cron" "$next_cron"' EXIT
            crontab -l > "$current_cron" 2>/dev/null || true
            awk '
              $0 == "# STOCK_TRADING_CRON_BEGIN" { managed = 1; next }
              $0 == "# STOCK_TRADING_CRON_END" { managed = 0; next }
              !managed { print }
            ' "$current_cron" > "$next_cron"
            cat "$cron_file" >> "$next_cron"
            crontab "$next_cron"
