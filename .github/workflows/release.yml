name: Release Wheel

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: stock-trading-wheel-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release branch
        shell: bash
        run: |
          git fetch origin stock-trading --depth=1
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Release tag must point to the latest origin/stock-trading commit" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate release version
        shell: bash
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$project_version"

      - name: Validate cron
        shell: bash
        run: |
          test "$(grep -c '^# STOCK_TRADING_CRON_BEGIN$' .github/config/stock-trading.cron)" -eq 1
          test "$(grep -c '^# STOCK_TRADING_CRON_END$' .github/config/stock-trading.cron)" -eq 1
          test "$(grep -Ec '^[0-9]+ [0-9]+ ' .github/config/stock-trading.cron)" -eq 6
          grep -Fq '__DEPLOY_DIR__/venv/bin' .github/config/stock-trading.cron
          grep -Fq 'stock-trading sell' .github/config/stock-trading.cron
          grep -Fq 'stock-trading buy' .github/config/stock-trading.cron
          grep -Fq 'stock-trading market' .github/config/stock-trading.cron
          grep -Fq 'stock-trading evaluate' .github/config/stock-trading.cron
          grep -Fq 'stock-trading clean' .github/config/stock-trading.cron
          grep -Fq '/usr/sbin/logrotate' .github/config/stock-trading.cron
          test -f .github/config/stock-trading.logrotate

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Upload release files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          source: "dist/*.whl,.github/config/stock-trading.cron,.github/config/stock-trading.logrotate"
          target: ${{ format('{0}/releases/{1}', vars.SERVER_DEPLOY_DIR, github.ref_name) }}
          strip_components: 1
          overwrite: true

      - name: Install release with uv
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_DIR: ${{ vars.SERVER_DEPLOY_DIR }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          envs: DEPLOY_DIR,RELEASE_TAG
          command_timeout: 60m
          script: |
            set -eu
            deploy_dir="${DEPLOY_DIR%/}"
            release_dir="$deploy_dir/releases/$RELEASE_TAG"
            venv_dir="$deploy_dir/venv"
            cron_template="$release_dir/config/stock-trading.cron"
            logrotate_template="$release_dir/config/stock-trading.logrotate"
            cron_dir="$deploy_dir/cron"
            cron_file="$cron_dir/stock-trading.cron"

            if [ ! -s /etc/stock-trading/env ] || [ ! -r /etc/stock-trading/env ]; then
              echo "Missing or unreadable operator-managed environment file: /etc/stock-trading/env" >&2
              exit 1
            fi

            set -- "$release_dir"/*.whl
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "Expected exactly one wheel in $release_dir" >&2
              exit 1
            fi
            wheel="$1"

            export UV_DEFAULT_INDEX="https://mirrors.aliyun.com/pypi/simple/"
            export UV_HTTP_TIMEOUT=300
            export UV_HTTP_RETRIES=5
            export PATH="$HOME/.local/bin:$PATH"

            uv python install 3.12
            uv venv \
              --allow-existing \
              --managed-python \
              --python 3.12 \
              "$venv_dir"
            uv pip install \
              --python "$venv_dir/bin/python" \
              --upgrade \
              "$wheel"
            "$venv_dir/bin/stock-trading" --help >/dev/null

            mkdir -p \
              "$cron_dir" \
              /data/stock-trading/market \
              /data/stock-trading/qlib \
              /data/stock-trading/artifacts \
              /data/stock-trading/state \
              /var/log/stock-trading
            touch \
              /data/stock-trading/state/scheduler.lock \
              /var/log/stock-trading/run.log

            legacy_var_dir="$venv_dir/lib/python3.12/var"
            migration_marker="/data/stock-trading/state/.legacy-var-migrated"
            exec 9>/data/stock-trading/state/scheduler.lock
            if ! flock -n 9; then
              echo "Another stock-trading task is active; refusing data migration" >&2
              exit 1
            fi
            restart_init=0
            init_pattern="$venv_dir/bin/python $venv_dir/bin/[s]tock-trading init"
            if pgrep -af "$init_pattern"; then
              echo "Stopping the active init command gracefully before migration"
              pkill -INT -f "$init_pattern"
              wait_count=0
              while pgrep -f "$init_pattern" >/dev/null; do
                if [ "$wait_count" -ge 12 ]; then
                  echo "The init command did not stop within 60 seconds; refusing migration" >&2
                  exit 1
                fi
                sleep 5
                wait_count=$((wait_count + 1))
              done
              restart_init=1
            fi
            if pgrep -af "$venv_dir/bin/[s]tock-trading|$venv_dir/bin/python.*[s]tock_trading"; then
              echo "Another stock-trading process is still writing data; refusing migration" >&2
              exit 1
            fi
            if [ ! -f "$migration_marker" ] && [ -d "$legacy_var_dir" ]; then
              for runtime_part in market qlib artifacts state; do
                source_dir="$legacy_var_dir/$runtime_part"
                target_dir="/data/stock-trading/$runtime_part"
                if [ ! -d "$source_dir" ]; then
                  continue
                fi
                cp -a "$source_dir/." "$target_dir/"
                source_files="$(find "$source_dir" -type f | wc -l)"
                target_files="$(find "$target_dir" -type f | wc -l)"
                source_bytes="$(du -sb "$source_dir" | awk '{print $1}')"
                target_bytes="$(du -sb "$target_dir" | awk '{print $1}')"
                echo "Migrated $runtime_part: sourceFiles=$source_files targetFiles=$target_files sourceBytes=$source_bytes targetBytes=$target_bytes"
                if [ "$target_files" -lt "$source_files" ] || [ "$target_bytes" -lt "$source_bytes" ]; then
                  echo "Migration verification failed for $runtime_part" >&2
                  exit 1
                fi
              done
              touch "$migration_marker"
              echo "Legacy runtime data migration completed; source data retained at $legacy_var_dir"
            else
              echo "Legacy runtime data migration already completed or no source directory exists"
            fi

            sed \
              -e "s|__DEPLOY_DIR__|$deploy_dir|g" \
              -e '/^# AI_GENERATE_/d' \
              "$cron_template" > "$cron_file"
            cp "$logrotate_template" "$cron_dir/stock-trading.logrotate"

            current_cron="$(mktemp)"
            next_cron="$(mktemp)"
            trap 'rm -f "$current_cron" "$next_cron"' EXIT
            crontab -l > "$current_cron" 2>/dev/null || true
            awk '
              $0 == "# STOCK_TRADING_CRON_BEGIN" { managed = 1; next }
              $0 == "# STOCK_TRADING_CRON_END" { managed = 0; next }
              !managed { print }
            ' "$current_cron" > "$next_cron"
            if [ -s "$next_cron" ]; then
              printf '\n' >> "$next_cron"
            fi
            cat "$cron_file" >> "$next_cron"
            crontab "$next_cron"

            flock -u 9
            exec 9>&-
            if [ "$restart_init" -eq 1 ]; then
              init_pid_file="/data/stock-trading/state/init.pid"
              nohup /usr/bin/flock -n /data/stock-trading/state/scheduler.lock \
                /bin/bash -c "set -a; source /etc/stock-trading/env; set +a; exec '$venv_dir/bin/stock-trading' init" \
                >> /var/log/stock-trading/run.log 2>&1 < /dev/null &
              echo "$!" > "$init_pid_file"
              sleep 2
              if ! kill -0 "$(cat "$init_pid_file")" 2>/dev/null; then
                echo "Failed to restart init after migration" >&2
                exit 1
              fi
              echo "Init restarted from the fixed runtime directory; pid=$(cat "$init_pid_file")"
            fi
