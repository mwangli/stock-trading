name: Production Inspect

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full source commit SHA expected in all application images
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect production host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect production state
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_DIR: ${{ vars.SERVER_DEPLOY_DIR }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          envs: DEPLOY_DIR,EXPECTED_SOURCE_SHA
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            cd "$DEPLOY_DIR"

            echo "=== ENV_KEYS ==="
            test -f .env
            sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' .env | sort

            echo "=== COMPOSE_SERVICES ==="
            sed -n 's/^  \(stock-[A-Za-z0-9_-]*\):$/\1/p' docker-compose.yml

            echo "=== CONTAINERS ==="
            docker ps -a --filter 'name=stock-' \
              --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

            echo "=== CONTAINER_DETAILS ==="
            container_failure=0
            for container in stock-frontend stock-backend stock-agent stock-mysql stock-mongo stock-redis; do
              if docker inspect "$container" >/dev/null 2>&1; then
                image="$(docker inspect --format '{{.Config.Image}}' "$container")"
                state="$(docker inspect --format '{{.State.Status}}' "$container")"
                health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"
                started="$(docker inspect --format '{{.State.StartedAt}}' "$container")"
                printf '%s image=%s state=%s health=%s started=%s\n' \
                  "$container" "$image" "$state" "$health" "$started"
                if [[ "$state" != "running" ]] || [[ "$health" != "healthy" ]]; then
                  container_failure=1
                fi
                if [[ "$container" == "stock-frontend" ]]; then
                  if [[ "$image" != *":$EXPECTED_SOURCE_SHA" ]]; then
                    echo "Unexpected application image for $container: $image"
                    container_failure=1
                  fi
                fi
                if [[ "$container" == "stock-backend" || "$container" == "stock-agent" ]]; then
                  image_id="$(docker inspect --format '{{.Image}}' "$container")"
                  source_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")"
                  model_tree="$(docker image inspect --format '{{index .Config.Labels "com.stock.model.tree"}}' "$image_id")"
                  model_image="$(docker image inspect --format '{{index .Config.Labels "com.stock.model.image"}}' "$image_id")"
                  printf '%s sourceRevision=%s modelTree=%s modelImage=%s\n' \
                    "$container" "$source_revision" "$model_tree" "$model_image"
                  if [[ "$source_revision" != "$EXPECTED_SOURCE_SHA" ]] \
                    || [[ -z "$model_tree" ]] \
                    || [[ -z "$model_image" ]]; then
                    container_failure=1
                  fi
                fi
              else
                printf '%s missing\n' "$container"
                container_failure=1
              fi
            done

            echo "=== IMAGE_MODEL_ARTIFACTS ==="
            artifact_failure=0
            for artifact in \
              "stock-agent|/app/model-files/embedding/bge-base-zh-v1.5/bge-base-zh-v1.5.pt|409479401" \
              "stock-backend|/app/model-files/sentiment/finbert-tone-chinese-e91b1a3a/sentiment-finbert.pt|409497147" \
              "stock-backend|/app/model-files/sentiment/mengzi-bert-base-fin-3e525b4d-djl/mengzi-bert-base-fin-3e525b4d.pt|409589213"; do
              IFS='|' read -r container path expected_size <<< "$artifact"
              if docker exec "$container" test -f "$path" >/dev/null 2>&1; then
                size="$(docker exec "$container" stat -c '%s' "$path")"
                printf '%s path=%s state=present size=%s expected=%s\n' \
                  "$container" "$path" "$size" "$expected_size"
                if [[ "$size" != "$expected_size" ]]; then
                  artifact_failure=1
                fi
              else
                printf '%s path=%s state=missing\n' "$container" "$path"
                artifact_failure=1
              fi
            done

            echo "=== MODEL_MOUNTS ==="
            mount_failure=0
            for container in stock-backend stock-agent; do
              model_mount="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/model-files"}}{{.Source}}{{end}}{{end}}' "$container")"
              printf '%s modelMount=%s\n' "$container" "${model_mount:-none}"
              if [[ -n "$model_mount" ]]; then
                mount_failure=1
              fi
            done

            echo "=== FRONTEND_HEALTH ==="
            curl --fail --silent --show-error http://127.0.0.1/healthz

            echo "=== APPLICATION_LOGS ==="
            for container in stock-frontend stock-backend stock-agent; do
              echo "--- $container ---"
              docker logs --tail=100 "$container" 2>&1
            done

            echo "=== HOST_RESOURCES ==="
            free -m
            df -h "$DEPLOY_DIR"
            docker version --format 'server={{.Server.Version}} client={{.Client.Version}}'

            test "$container_failure" -eq 0
            test "$artifact_failure" -eq 0
            test "$mount_failure" -eq 0
