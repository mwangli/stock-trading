name: Frontend CI/CD

on:
  push:
    branches:
      - master
    paths:
      - frontend/**
      - docker-compose.yml
      - .github/workflows/frontend-ci-cd.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
  ACR_USERNAME: ${{ vars.ACR_USERNAME }}
  SERVER_HOST: ${{ vars.SERVER_HOST }}
  SERVER_PORT: ${{ vars.SERVER_PORT }}
  SERVER_USER: ${{ vars.SERVER_USER }}
  SERVER_DEPLOY_DIR: ${{ vars.SERVER_DEPLOY_DIR }}
  SERVER_FINGERPRINT: ${{ vars.SERVER_FINGERPRINT }}
  IMAGE_REPOSITORY: ${{ format('{0}/{1}/{2}', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, vars.FRONTEND_IMAGE_NAME) }}

jobs:
  build-and-push:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve immutable image tag
        id: image
        run: echo "value=${IMAGE_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.value }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha,scope=stock-web
          cache-to: type=gha,mode=max,scope=stock-web
          provenance: false

  deploy:
    name: Deploy frontend to production
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Upload Docker Compose configuration
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          fingerprint: ${{ env.SERVER_FINGERPRINT }}
          source: docker-compose.yml
          target: ${{ env.SERVER_DEPLOY_DIR }}
          overwrite: true

      - name: Pull image and restart frontend
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_IMAGE: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_DIR: ${{ env.SERVER_DEPLOY_DIR }}
          ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
          ACR_USERNAME: ${{ env.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          fingerprint: ${{ env.SERVER_FINGERPRINT }}
          envs: DEPLOY_IMAGE,DEPLOY_DIR,ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD
          command_timeout: 12m
          script: |
            bash -se <<'DEPLOY_SCRIPT'
            set -Eeuo pipefail

            cd "$DEPLOY_DIR"
            test -f .env
            test -f docker-compose.yml

            docker_config="$(mktemp -d)"
            export DOCKER_CONFIG="$docker_config"
            cleanup_registry() {
              docker logout "$ACR_REGISTRY" >/dev/null 2>&1 || true
              rm -rf "$docker_config"
            }
            trap cleanup_registry EXIT

            previous_image="$(docker inspect --format '{{.Config.Image}}' stock-web 2>/dev/null || true)"

            rollback() {
              exit_code=$?
              trap - ERR
              echo "Frontend deployment failed; collecting logs."
              docker compose --env-file .env logs --tail=150 stock-web || true
              if [ -n "$previous_image" ]; then
                echo "Rolling back to the previous frontend image."
                STOCK_WEB_IMAGE="$previous_image" \
                  docker compose --env-file .env up -d --no-deps --force-recreate stock-web || true
              fi
              exit "$exit_code"
            }
            trap rollback INT TERM HUP ERR

            printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" \
              --username "$ACR_USERNAME" --password-stdin
            docker pull "$DEPLOY_IMAGE"

            STOCK_WEB_IMAGE="$DEPLOY_IMAGE" docker compose --env-file .env config --quiet
            STOCK_WEB_IMAGE="$DEPLOY_IMAGE" \
              docker compose --env-file .env up -d --no-deps --force-recreate stock-web

            container_id="$(docker compose --env-file .env ps -q stock-web)"
            test -n "$container_id"

            healthy=0
            attempt=1
            while [ "$attempt" -le 24 ]; do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
              if [ "$status" = healthy ]; then
                healthy=1
                break
              fi
              if [ "$status" = unhealthy ] || [ "$status" = exited ] || [ "$status" = dead ]; then
                break
              fi
              sleep 5
              attempt=$((attempt + 1))
            done

            test "$healthy" -eq 1
            trap - INT TERM HUP ERR
            docker compose --env-file .env ps stock-web
            DEPLOY_SCRIPT
