name: Agent Model Image

on:
  push:
    branches:
      - master
    paths:
      - 'model-files/embedding/**'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git tag, branch, or commit containing the model artifacts
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: agent-model-image-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_USERNAME: ${{ vars.ACR_USERNAME }}
  MODEL_IMAGE_REPOSITORY: ${{ format('{0}/{1}/{2}-models', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, vars.AGENT_IMAGE_NAME) }}

jobs:
  publish:
    name: Publish agent model image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout model image infrastructure
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          sparse-checkout: |
            .github/docker/agent-model-runtime.Dockerfile
            .github/scripts/verify-model-artifact.py
          sparse-checkout-cone-mode: false

      - name: Checkout embedding model artifacts
        uses: actions/checkout@v7
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}
          path: artifacts
          sparse-checkout: model-files/embedding
          sparse-checkout-cone-mode: false

      - name: Resolve immutable model version
        id: model
        run: |
          set -Eeuo pipefail
          echo "source_sha=$(git -C artifacts rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git -C artifacts rev-parse HEAD:model-files/embedding)" >> "$GITHUB_OUTPUT"

      - name: Download embedding artifacts from Git LFS
        run: git -C artifacts lfs pull --include="model-files/embedding/**" --exclude=""

      - name: Verify embedding artifacts
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/verify-model-artifact.py \
            artifacts/model-files/embedding/bge-base-zh-v1.5/manifest.json \
            /tmp/agent-artifacts.sha256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push agent model image
        uses: docker/build-push-action@v7
        with:
          context: artifacts/model-files/embedding
          file: .github/docker/agent-model-runtime.Dockerfile
          push: true
          tags: |
            ${{ env.MODEL_IMAGE_REPOSITORY }}:${{ steps.model.outputs.tree_sha }}
            ${{ env.MODEL_IMAGE_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.revision=${{ steps.model.outputs.source_sha }}
            com.stock.model.tree=${{ steps.model.outputs.tree_sha }}
            com.stock.model.scope=embedding
          cache-from: type=gha,scope=stock-agent-model
          cache-to: type=gha,mode=max,scope=stock-agent-model
          provenance: false

      - name: Trigger agent application rebuild and deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.model.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          gh workflow run agent-ci-cd.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            --field release_ref="$RELEASE_REF"
