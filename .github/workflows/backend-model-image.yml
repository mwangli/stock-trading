name: Backend Model Image

on:
  push:
    branches:
      - master
    paths:
      - 'model-files/sentiment/**'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Backend Git tag, branch, or commit to rebuild and deploy
        required: true
        type: string
      model_ref:
        description: Optional Git ref containing the sentiment artifacts; defaults to the workflow commit
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: backend-model-image-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_USERNAME: ${{ vars.ACR_USERNAME }}
  MODEL_IMAGE_REPOSITORY: ${{ format('{0}/{1}/{2}-models', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, vars.BACKEND_IMAGE_NAME) }}

jobs:
  publish:
    name: Publish backend model image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout model image infrastructure
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          sparse-checkout: |
            .github/docker/backend-model-runtime.Dockerfile
            .github/scripts/verify-model-artifact.py
          sparse-checkout-cone-mode: false

      - name: Checkout sentiment model artifacts
        uses: actions/checkout@v7
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          persist-credentials: false
          ref: ${{ inputs.model_ref || github.sha }}
          path: artifacts
          sparse-checkout: model-files/sentiment
          sparse-checkout-cone-mode: false

      - name: Resolve immutable model version
        id: model
        run: |
          set -Eeuo pipefail
          echo "source_sha=$(git -C artifacts rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git -C artifacts rev-parse HEAD:model-files/sentiment)" >> "$GITHUB_OUTPUT"

      - name: Download sentiment artifacts from Git LFS
        run: git -C artifacts lfs pull --include="model-files/sentiment/**" --exclude=""

      - name: Verify sentiment artifacts
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/verify-model-artifact.py \
            artifacts/model-files/sentiment/finbert-tone-chinese-e91b1a3a/manifest.json \
            /tmp/backend-finbert-artifacts.sha256
          python3 .github/scripts/verify-model-artifact.py \
            artifacts/model-files/sentiment/mengzi-bert-base-fin-3e525b4d-djl/manifest.json \
            /tmp/backend-mengzi-artifacts.sha256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend model image
        uses: docker/build-push-action@v7
        with:
          context: artifacts/model-files/sentiment
          file: .github/docker/backend-model-runtime.Dockerfile
          push: true
          tags: |
            ${{ env.MODEL_IMAGE_REPOSITORY }}:${{ steps.model.outputs.tree_sha }}
            ${{ env.MODEL_IMAGE_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.revision=${{ steps.model.outputs.source_sha }}
            com.stock.model.tree=${{ steps.model.outputs.tree_sha }}
            com.stock.model.scope=sentiment
          cache-from: type=gha,scope=stock-backend-model
          cache-to: type=gha,mode=max,scope=stock-backend-model
          provenance: false

      - name: Trigger backend application rebuild and deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref || github.sha }}
          MODEL_REF: ${{ steps.model.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          gh workflow run backend-ci-cd.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            --field release_ref="$RELEASE_REF" \
            --field model_ref="$MODEL_REF"
