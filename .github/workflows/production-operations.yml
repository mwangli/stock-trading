name: Production Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation to execute
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - cleanup
          - bootstrap
      history_retention_days:
        description: Backup and operation history retention days
        required: true
        default: '30'
        type: string
      journal_retention_days:
        description: System journal retention days used by cleanup
        required: true
        default: '14'
        type: string

permissions:
  contents: read

concurrency:
  group: stock-production
  cancel-in-progress: false

jobs:
  operate:
    name: Run production operation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout production operation files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            docker-compose.yml
            .github/scripts/bootstrap-production.sh
            .github/scripts/production-maintenance.sh
          sparse-checkout-cone-mode: false

      - name: Upload production operation files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          source: docker-compose.yml,.github/scripts/bootstrap-production.sh,.github/scripts/production-maintenance.sh
          target: ${{ vars.SERVER_DEPLOY_DIR }}
          overwrite: true

      - name: Execute production operation
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_DIR: ${{ vars.SERVER_DEPLOY_DIR }}
          PRODUCTION_OPERATION: ${{ inputs.operation }}
          HISTORY_RETENTION_DAYS: ${{ inputs.history_retention_days }}
          JOURNAL_RETENTION_DAYS: ${{ inputs.journal_retention_days }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          envs: DEPLOY_DIR,PRODUCTION_OPERATION,HISTORY_RETENTION_DAYS,JOURNAL_RETENTION_DAYS
          command_timeout: 15m
          script: |
            case "$PRODUCTION_OPERATION" in
              bootstrap)
                bash "$DEPLOY_DIR/.github/scripts/bootstrap-production.sh"
                ;;
              inspect|cleanup)
                MAINTENANCE_OPERATION="$PRODUCTION_OPERATION" \
                  bash "$DEPLOY_DIR/.github/scripts/production-maintenance.sh"
                ;;
              *)
                echo "Unsupported production operation: $PRODUCTION_OPERATION" >&2
                exit 1
                ;;
            esac
