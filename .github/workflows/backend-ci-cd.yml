name: Backend CI/CD

on:
  push:
    tags:
      - 'backend-v*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git tag, branch, or commit to build and deploy
        required: true
        type: string
      model_ref:
        description: Optional Git ref containing the published sentiment model image
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stock-production
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
  ACR_USERNAME: ${{ vars.ACR_USERNAME }}
  SERVER_HOST: ${{ vars.SERVER_HOST }}
  SERVER_PORT: ${{ vars.SERVER_PORT }}
  SERVER_USER: ${{ vars.SERVER_USER }}
  SERVER_DEPLOY_DIR: ${{ vars.SERVER_DEPLOY_DIR }}
  SERVER_FINGERPRINT: ${{ vars.SERVER_FINGERPRINT }}
  IMAGE_REPOSITORY: ${{ format('{0}/{1}/{2}', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, vars.BACKEND_IMAGE_NAME) }}
  MODEL_IMAGE_REPOSITORY: ${{ format('{0}/{1}/{2}-models', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, vars.BACKEND_IMAGE_NAME) }}

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Checkout release infrastructure
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          sparse-checkout: |
            stock-backend/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.ref }}
          path: release
          sparse-checkout: |
            pom.xml
            stock-backend
          sparse-checkout-cone-mode: false

      - name: Checkout model version pointer
        uses: actions/checkout@v7
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          persist-credentials: false
          ref: ${{ inputs.model_ref || github.ref }}
          path: artifacts
          sparse-checkout: model-files/sentiment
          sparse-checkout-cone-mode: false

      - name: Resolve immutable source and model versions
        id: versions
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C release rev-parse HEAD)"
          model_tree="$(git -C artifacts rev-parse HEAD:model-files/sentiment)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "model_tree=$model_tree" >> "$GITHUB_OUTPUT"
          echo "model_tag=${model_tree:0:12}" >> "$GITHUB_OUTPUT"
          echo "model_image=${MODEL_IMAGE_REPOSITORY}:${model_tree}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Verify backend model image exists
        env:
          MODEL_IMAGE: ${{ steps.versions.outputs.model_image }}
        run: docker buildx imagetools inspect "$MODEL_IMAGE" >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            release/pom.xml
            release/stock-backend/pom.xml
          verify-signature: true

      - name: Package backend
        run: |
          set -Eeuo pipefail
          mvn --batch-mode --no-transfer-progress \
            --file release/pom.xml --projects stock-backend --also-make \
            clean package -DskipTests
          jar_path="$(find release/stock-backend/target -maxdepth 1 -type f \
            -name 'stock-backend-*.jar' ! -name '*.original' -print -quit)"
          test -n "$jar_path"
          install -m 0644 "$jar_path" release/stock-backend/app.jar

      - name: Resolve immutable image tag
        id: image
        run: echo "value=${IMAGE_REPOSITORY}:${{ steps.versions.outputs.source_sha }}-${{ steps.versions.outputs.model_tag }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: release/stock-backend
          file: stock-backend/Dockerfile
          build-args: |
            MODEL_RUNTIME_IMAGE=${{ steps.versions.outputs.model_image }}
          push: true
          tags: |
            ${{ steps.image.outputs.value }}
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.versions.outputs.source_sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.revision=${{ steps.versions.outputs.source_sha }}
            com.stock.model.tree=${{ steps.versions.outputs.model_tree }}
            com.stock.model.image=${{ steps.versions.outputs.model_image }}
          cache-from: type=gha,scope=stock-backend
          cache-to: type=gha,mode=max,scope=stock-backend
          provenance: false

  deploy:
    name: Deploy backend to production
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          sparse-checkout: |
            docker-compose.yml
            .github/scripts/deploy-service.sh
          sparse-checkout-cone-mode: false

      - name: Upload deployment files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          fingerprint: ${{ env.SERVER_FINGERPRINT }}
          source: docker-compose.yml,.github/scripts/deploy-service.sh
          target: ${{ env.SERVER_DEPLOY_DIR }}
          overwrite: true

      - name: Restart backend
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_IMAGE: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_DIR: ${{ env.SERVER_DEPLOY_DIR }}
          ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
          ACR_USERNAME: ${{ env.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          fingerprint: ${{ env.SERVER_FINGERPRINT }}
          envs: DEPLOY_IMAGE,DEPLOY_DIR,ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD
          command_timeout: 12m
          script: bash "$DEPLOY_DIR/.github/scripts/deploy-service.sh" stock-backend stock-backend STOCK_BACKEND_IMAGE
