name: CI/CD

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Development Agent task ID
        required: false
        type: string
      commit_sha:
        description: Expected commit SHA
        required: false
        type: string
      deploy:
        description: Build images and deploy after verification
        required: false
        default: false
        type: boolean
  push:
    branches:
      - stock-web
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: stock-production
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_USERNAME: ${{ vars.ACR_USERNAME }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - name: Validate Agent commit
        if: github.event_name == 'workflow_dispatch' && inputs.commit_sha != ''
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_COMMIT"

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        run: mvn -B -f stock-server/pom.xml test
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: stock-client/package-lock.json
      - name: Build frontend
        working-directory: stock-client
        run: |
          npm ci
          npm run build

  backend-image:
    needs:
      - prepare
      - verify
    if: github.event_name == 'push' || inputs.deploy == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: stock-server/Dockerfile
          provenance: false
          push: true
          tags: ${{ format('{0}/{1}/{2}:{3}', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, vars.BACKEND_IMAGE_NAME, github.sha) }}

  frontend-image:
    needs:
      - prepare
      - verify
    if: github.event_name == 'push' || inputs.deploy == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: stock-client/Dockerfile
          provenance: false
          push: true
          tags: ${{ format('{0}/{1}/{2}:{3}', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, vars.FRONTEND_IMAGE_NAME, github.sha) }}

  deploy:
    needs:
      - backend-image
      - frontend-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Upload deployment configuration
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          source: docker-compose.yml
          target: /tmp/stock-web-deploy
          overwrite: true
      - name: Deploy and verify services
        uses: appleboy/ssh-action@v1.2.5
        env:
          BACKEND_IMAGE: ${{ format('{0}/{1}/{2}:{3}', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, vars.BACKEND_IMAGE_NAME, github.sha) }}
          FRONTEND_IMAGE: ${{ format('{0}/{1}/{2}:{3}', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, vars.FRONTEND_IMAGE_NAME, github.sha) }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ vars.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          STOCK_CONSOLE_PORT: ${{ vars.STOCK_CONSOLE_PORT }}
          STOCK_BACKEND_PORT: ${{ vars.STOCK_BACKEND_PORT }}
          STOCK_DATA_HTPASSWD: ${{ secrets.STOCK_DATA_HTPASSWD }}
          CONSOLE_USERNAME: ${{ vars.CONSOLE_USERNAME }}
          CONSOLE_PASSWORD_HASH: ${{ secrets.CONSOLE_PASSWORD_HASH }}
          AGENT_ENABLED: ${{ vars.AGENT_ENABLED }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          AGENT_TIMEOUT_SECONDS: ${{ vars.AGENT_TIMEOUT_SECONDS }}
          AGENT_MAX_TOKENS: ${{ vars.AGENT_MAX_TOKENS }}
          GITHUB_AGENT_ENABLED: ${{ vars.GITHUB_AGENT_ENABLED }}
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER }}
          GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}
          GITHUB_BRANCH: ${{ vars.GITHUB_BRANCH }}
          GITHUB_WORKFLOW: ${{ vars.GITHUB_WORKFLOW }}
          GITHUB_MAX_REPAIR_ROUNDS: ${{ vars.GITHUB_MAX_REPAIR_ROUNDS }}
          GITHUB_POLL_INTERVAL_SECONDS: ${{ vars.GITHUB_POLL_INTERVAL_SECONDS }}
          GITHUB_WORKFLOW_TIMEOUT_MINUTES: ${{ vars.GITHUB_WORKFLOW_TIMEOUT_MINUTES }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_PORT }}
          fingerprint: ${{ vars.SERVER_FINGERPRINT }}
          command_timeout: 30m
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD,STOCK_CONSOLE_PORT,STOCK_BACKEND_PORT,STOCK_DATA_HTPASSWD,CONSOLE_USERNAME,CONSOLE_PASSWORD_HASH,AGENT_ENABLED,DEEPSEEK_BASE_URL,DEEPSEEK_API_KEY,DEEPSEEK_MODEL,AGENT_TIMEOUT_SECONDS,AGENT_MAX_TOKENS,GITHUB_AGENT_ENABLED,GITHUB_TOKEN,GITHUB_OWNER,GITHUB_REPOSITORY,GITHUB_BRANCH,GITHUB_WORKFLOW,GITHUB_MAX_REPAIR_ROUNDS,GITHUB_POLL_INTERVAL_SECONDS,GITHUB_WORKFLOW_TIMEOUT_MINUTES
          script: |
            set -eu
            DEPLOY_DIR="/tmp/stock-web-deploy"
            trap 'rm -rf "$DEPLOY_DIR"' EXIT
            cd "$DEPLOY_DIR"

            [ -n "$STOCK_DATA_HTPASSWD" ] || { echo "STOCK_DATA_HTPASSWD is required" >&2; exit 1; }
            mkdir -p /root/stock-trading/config
            umask 077
            printf '%s\n' "$STOCK_DATA_HTPASSWD" > /root/stock-trading/config/stock-data.htpasswd
            chmod 644 /root/stock-trading/config/stock-data.htpasswd

            old_backend="$(docker inspect --format '{{.Config.Image}}' stock-backend 2>/dev/null || true)"
            old_frontend="$(docker inspect --format '{{.Config.Image}}' stock-frontend 2>/dev/null || true)"

            rollback() {
              echo "Deployment health check failed, restoring previous images" >&2
              if [ -n "$old_backend" ] && [ -n "$old_frontend" ]; then
                export STOCK_BACKEND_IMAGE="$old_backend"
                export STOCK_FRONTEND_IMAGE="$old_frontend"
                docker compose up -d --no-deps --no-build stock-backend stock-frontend || true
              fi
            }

            wait_healthy() {
              container="$1"
              attempts=0
              while [ "$attempts" -lt 30 ]; do
                status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
                [ "$status" = "healthy" ] && return 0
                if [ "$status" = "unhealthy" ]; then
                  docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "$container" >&2 || true
                  docker logs --tail 200 "$container" >&2 || true
                  return 1
                fi
                attempts=$((attempts + 1))
                sleep 5
              done
              docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "$container" >&2 || true
              docker logs --tail 200 "$container" >&2 || true
              return 1
            }

            printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
            export STOCK_BACKEND_IMAGE="$BACKEND_IMAGE"
            export STOCK_FRONTEND_IMAGE="$FRONTEND_IMAGE"
            docker compose pull stock-backend stock-frontend
            docker compose up -d --no-deps --no-build stock-backend
            if ! wait_healthy stock-backend; then
              rollback
              exit 1
            fi
            docker compose up -d --no-deps --no-build stock-frontend
            if ! wait_healthy stock-frontend; then
              rollback
              exit 1
            fi

            [ -z "$old_backend" ] || [ "$old_backend" = "$BACKEND_IMAGE" ] || docker image rm "$old_backend" || true
            [ -z "$old_frontend" ] || [ "$old_frontend" = "$FRONTEND_IMAGE" ] || docker image rm "$old_frontend" || true
