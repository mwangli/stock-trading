# AI_GENERATE_START -----
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://stock-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location ^~ /dev-data/market/ {
        auth_basic "Stock Trading Development Data";
        auth_basic_user_file /etc/nginx/auth/dev-data.htpasswd;

        alias /data/stock-trading/market/;
        autoindex on;
        autoindex_format json;
        default_type application/octet-stream;

        limit_except GET HEAD {
            deny all;
        }

        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /dev-data/sqlite/trading.db {
        auth_basic "Stock Trading Development Data";
        auth_basic_user_file /etc/nginx/auth/dev-data.htpasswd;

        alias /data/stock-trading/state/trading.db;
        default_type application/vnd.sqlite3;

        limit_except GET HEAD {
            deny all;
        }

        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    location /ws/ {
        proxy_pass http://stock-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
# AI_GENERATE_END -----
