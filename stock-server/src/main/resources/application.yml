spring:
  application:
    name: stock-console
  profiles:
    default: local
server:
  port: 8080
  servlet:
    session:
      timeout: ${CONSOLE_SESSION_TIMEOUT:8h}
      cookie:
        name: STOCK_CONSOLE_SESSION
        http-only: true
        same-site: lax
console:
  data-dir: ${STOCK_TRADING_DATA_DIR:D:/stock-trading4/data}
  task-log: ${STOCK_TASK_LOG:/var/log/stock-trading/run.log}
  document-roots: ${STOCK_DOCUMENT_ROOTS:documents,../documents}
  auth:
    username: ${CONSOLE_USERNAME:admin}
    password-hash: '${CONSOLE_PASSWORD_HASH:}'
  agent:
    enabled: ${AGENT_ENABLED:true}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-seconds: ${AGENT_TIMEOUT_SECONDS:90}
    max-tokens: ${AGENT_MAX_TOKENS:1800}
  github-agent:
    enabled: ${GITHUB_AGENT_ENABLED:false}
    token: ${GITHUB_TOKEN:}
    owner: ${GITHUB_OWNER:mwangli}
    repository: ${GITHUB_REPOSITORY:stock-trading}
    branch: ${GITHUB_BRANCH:stock-web}
    workflow: ${GITHUB_WORKFLOW:ci-cd.yml}
    max-repair-rounds: ${GITHUB_MAX_REPAIR_ROUNDS:2}
    poll-interval-seconds: ${GITHUB_POLL_INTERVAL_SECONDS:10}
    workflow-timeout-minutes: ${GITHUB_WORKFLOW_TIMEOUT_MINUTES:45}
