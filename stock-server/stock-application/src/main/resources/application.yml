spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: stock-backend
  datasource:
    url: jdbc:mysql://117.72.216.67:6033/stock_trading?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DATABASE_PASSWORD}
    hikari:
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  flyway:
    enabled: false
  data:
    mongodb:
      auto-index-creation: true
      uri: "mongodb://admin:${DATABASE_PASSWORD}@117.72.216.67:27017/stock_trading?authSource=admin&compressors=zlib&zlibCompressionLevel=6"
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: Asia/Shanghai
  quartz:
    startup-delay: 5s
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: stock-trading-quartz
      org.quartz.threadPool.threadCount: 5

server:
  servlet:
    session:
      timeout: ${HTTP_SESSION_TIMEOUT:8h}
      cookie:
        name: STOCK_SESSION
        same-site: lax
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml

zxbroker:
  enabled: true
  captcha-auto-submit-enabled: true

agent:
  enabled: true
  provider: deepseek
  deepseek:
    enabled: true
    api-key: ${DEEPSEEK_API_KEY:}
  timeout-ms: 120000
  circuit-breaker-failure-threshold: 1
  rag-enabled: true
  embedding:
    enabled: true
    provider: djl

models:
  lstm:
    residual-head-enabled: false
  sentiment:
    model-version: finbert-tone-chinese-e91b1a3a
  temporal-ensemble:
    master-shadow-enabled: true
    production-blend-enabled: true
    news-features-embedded: true
    news-feature-version: temporal-news-v2-8d

app:
  market:
    tushare:
      token: ${TUSHARE_TOKEN:}
