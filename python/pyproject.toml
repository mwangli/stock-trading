[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-models"
version = "0.1.0"
description = "Offline training, evaluation, and ONNX artifact tooling for stock-trading4"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2.3,<3",
  "pandas>=2.3,<4",
  "pyarrow>=25,<26",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "torch>=2.14,<3",
  "transformers>=4.45,<6",
  "onnx>=1.23,<2",
  "onnxruntime>=1.30,<2",
  "scikit-learn>=1.7,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1"
]

[project.scripts]
stock-models = "stock_models.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
