runtime:
  root_dir: ./runtime
  datasets_dir: ./runtime/datasets
  runs_dir: ./runtime/runs
  artifacts_dir: ./runtime/artifacts
  cache_dir: ./runtime/cache

model:
  artifact_format: onnx
  default_precision: fp32
  opset_version: 17

training:
  seed: 20261009
  device: auto
  num_workers: 4

lstm:
  hidden_size: 50
  num_layers: 2
  dropout: 0.2
  stock_embedding_buckets: 8192
  stock_embedding_size: 16
  industry_embedding_buckets: 512
  industry_embedding_size: 8
  group_head_count: 8
  residual_head_enabled: true
  group_head_scale: 0.1
  residual_head_scale: 0.1
  return_loss_weight: 0.5
  direction_loss_weight: 0.3
  downside_loss_weight: 0.2
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  patience: 10
  min_delta: 0.0001
  onnx_max_abs_error: 0.0001

sentiment:
  pretrained_model: yiyanghkust/finbert-tone-chinese
  max_sequence_length: 128
  batch_size: 16
  epochs: 5
  learning_rate: 0.00002
  weight_decay: 0.01
  negative_label_id: 2
  onnx_max_abs_error: 0.0001

release:
  allow_int8_fallback: true
  int8_requires_resource_failure: true
  activate_from_python: false
