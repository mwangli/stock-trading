[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-trading"
version = "0.1.54"
description = "Minimal A-share T+1 model research and trading application"
requires-python = ">=3.11,<=3.12"
dependencies = [
    "baostock==0.9.4",
    "pandas>=2.2,<4",
    "Pillow>=11,<13",
    "pyarrow>=18,<24",
    "typer==0.27.3",
    "gym==0.26.2",
    "lightgbm>=4.5,<5",
    "pyqlib==0.9.7",
]

[project.scripts]
stock-help = "stock_trading.shortcuts:show_help"
stock-train = "stock_trading.shortcuts:train"
stock-collect = "stock_trading.shortcuts:collect"
stock-prepare = "stock_trading.shortcuts:prepare"
stock-rank = "stock_trading.shortcuts:rank"
stock-trading = "stock_trading.shortcuts:trading"
stock-order = "stock_trading.shortcuts:order"
stock-review = "stock_trading.shortcuts:review"
stock-clean = "stock_trading.shortcuts:clean"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stock_trading.market" = ["trade_dates_*.txt"]
