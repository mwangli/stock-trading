[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-trading"
version = "0.1.80"
description = "Minimal A-share T+1 model research and trading application"
requires-python = ">=3.11,<=3.12"
dependencies = [
    "baostock==0.9.4",
    "pandas>=2.2,<4",
    "pillow>=13,<14",
    "pyarrow>=18,<24",
    "gym==0.26.2",
    "lightgbm>=4.5,<5",
    "xgboost>=2.1,<4",
    "pyqlib==0.9.7",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "pytest-mock>=3,<4",
]

[project.scripts]
stock = "stock_trading.commands:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_trading = ["trade_dates.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "unit: 纯函数、解析器和状态层测试",
    "workflow: 工作流测试",
    "cli: CLI 参数、输出和退出码测试",
    "scenario: 多命令组合测试",
]
