[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-trading"
version = "0.1.67"
description = "Minimal A-share T+1 model research and trading application"
requires-python = ">=3.11,<=3.12"
dependencies = [
    "baostock==0.9.4",
    "pandas>=2.2,<4",
    "pillow>=13,<14",
    "pyarrow>=18,<24",
    "gym==0.26.2",
    "lightgbm>=4.5,<5",
    "xgboost>=2.1,<4",
    "pyqlib==0.9.7",
    "typer>=0.16,<1",
]

[project.scripts]
stock = "stock_trading.commands:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stock_trading.market" = ["trade_dates_*.txt"]
