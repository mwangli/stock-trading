services:
  stock-web:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DEV_WEB_HTTP_PORT:-3000}:80"

  stock-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "127.0.0.1:${DEV_BACKEND_HTTP_PORT:-8080}:8080"

  chrome:
    ports:
      - "127.0.0.1:${CHROME_GRID_PORT:-4444}:4444"
      - "127.0.0.1:${CHROME_VNC_PORT:-7900}:7900"

  stock-mysql:
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-6033}:3306"
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-D:/docker-data/stock-trading4/mysql}
        target: /var/lib/mysql
      - type: bind
        source: ./infrastructure/mysql/init
        target: /docker-entrypoint-initdb.d
        read_only: true

  stock-mongo:
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - type: bind
        source: ${MONGO_DATA_DIR:-D:/docker-data/stock-trading4/mongo}
        target: /data/db
      - type: bind
        source: ./infrastructure/mongo/init
        target: /docker-entrypoint-initdb.d
        read_only: true
