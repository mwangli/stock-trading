server:
  port: 8080

spring:
  application:
    name: stock-trading
  main:
    allow-bean-definition-overriding: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  # MySQL配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:6033/stock_trading?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:stock}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  data:

    mongodb:
      auto-index-creation: true
      host: ${SPRING_DATA_MONGODB_HOST:localhost}
      port: ${SPRING_DATA_MONGODB_PORT:27017}
      database: ${SPRING_DATA_MONGODB_DATABASE:stock_trading}
      authentication-database: ${SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE:admin}
      username: ${SPRING_DATA_MONGODB_USERNAME:stock}
      password: ${SPRING_DATA_MONGODB_PASSWORD:}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # 自动登录配置
  auto-login:
    account: ${STOCK_AUTO_LOGIN_ACCOUNT:}
    password: ${STOCK_AUTO_LOGIN_PASSWORD:}
    # 临时文件目录（验证码截图、SMS文件）
    tmp-dir: ""
    # 手机验证码邮件转发读取配置：默认关闭，建议通过 IDEA 环境变量覆盖
    sms-mail:
      enabled: ${AUTO_LOGIN_SMS_MAIL_ENABLED:false}
      host: ${AUTO_LOGIN_SMS_MAIL_HOST:}
      port: ${AUTO_LOGIN_SMS_MAIL_PORT:993}
      username: ${AUTO_LOGIN_SMS_MAIL_USERNAME:}
      password: ${AUTO_LOGIN_SMS_MAIL_PASSWORD:}
      folder: ${AUTO_LOGIN_SMS_MAIL_FOLDER:INBOX}
      sender-keyword: ${AUTO_LOGIN_SMS_MAIL_SENDER_KEYWORD:}
      content-keyword: ${AUTO_LOGIN_SMS_MAIL_CONTENT_KEYWORD:中信}
      scan-limit: ${AUTO_LOGIN_SMS_MAIL_SCAN_LIMIT:20}
      mark-seen: ${AUTO_LOGIN_SMS_MAIL_MARK_SEEN:false}

# 中信证券协议参数。默认关闭，真实值必须由运行环境注入。
zxbroker:
  enabled: ${ZXBROKER_ENABLED:false}
  mobile-code: ${ZXBROKER_MOBILE_CODE:}
  account: ${ZXBROKER_ACCOUNT:}
  encoded-password-key: ${ZXBROKER_ENCODED_PASSWORD_KEY:ENCODE_ACCOUNT_PASSWORD}
  sign-key: ${ZXBROKER_SIGN_KEY:}
  intact-to-server: ${ZXBROKER_INTACT_TO_SERVER:}
  token-expire-minutes: ${ZXBROKER_TOKEN_EXPIRE_MINUTES:30}
  history-page-size: ${ZXBROKER_HISTORY_PAGE_SIZE:500}
  history-max-records-per-window: ${ZXBROKER_HISTORY_MAX_RECORDS_PER_WINDOW:5000}
  history-request-interval-ms: ${ZXBROKER_HISTORY_REQUEST_INTERVAL_MS:200}

trading:
  # 仅保留真实交易方式；真实委托仍必须显式开启总门禁。
  mode: ${TRADING_MODE:LIVE_MANUAL}
  real-write-enabled: ${TRADING_REAL_WRITE_ENABLED:false}
  history-month-interval-ms: ${TRADING_HISTORY_MONTH_INTERVAL_MS:500}
  auto-buy-amount: ${TRADING_AUTO_BUY_AMOUNT:1000}
  auto-candidate-limit: ${TRADING_AUTO_CANDIDATE_LIMIT:1}
  take-profit-percent: ${TRADING_TAKE_PROFIT_PERCENT:3}
  force-exit-time: ${TRADING_FORCE_EXIT_TIME:14:50}

notification:
  wechat:
    enabled: ${WECHAT_NOTIFICATION_ENABLED:false}
    app-id: ${WECHAT_MINIPROGRAM_APP_ID:}
    app-secret: ${WECHAT_MINIPROGRAM_APP_SECRET:}
    open-id: ${WECHAT_MINIPROGRAM_OPEN_ID:}
    template-id: ${WECHAT_MINIPROGRAM_TEMPLATE_ID:}
    page: ${WECHAT_MINIPROGRAM_PAGE:pages/index/index}
    title-field: ${WECHAT_MINIPROGRAM_TITLE_FIELD:thing1}
    content-field: ${WECHAT_MINIPROGRAM_CONTENT_FIELD:thing2}

backtest:
  universe-limit: ${BACKTEST_UNIVERSE_LIMIT:500}
  lookback-days: ${BACKTEST_LOOKBACK_DAYS:5}
  random-seed: ${BACKTEST_RANDOM_SEED:20260925}
  commission-rate: ${BACKTEST_COMMISSION_RATE:0.0005}
  minimum-commission: ${BACKTEST_MINIMUM_COMMISSION:5}
  stamp-duty-rate: ${BACKTEST_STAMP_DUTY_RATE:0.0005}
  transfer-fee-rate: ${BACKTEST_TRANSFER_FEE_RATE:0}
  slippage-bps: ${BACKTEST_SLIPPAGE_BPS:5}
  fallback-price-limit-rate: ${BACKTEST_FALLBACK_PRICE_LIMIT_RATE:0.10}
  fee-version: ${BACKTEST_FEE_VERSION:CN_A_SHARE_ASSUMPTION_2026-09-25}
  code-version: ${APP_CODE_VERSION:WORKTREE_UNCOMMITTED}

# DJL模型配置（Windows 使用 pytorch-native-cu121 时需安装 NVIDIA 驱动 + CUDA 12.1）
djl:
  model:
    dir: ./models
    lstm:
      # 本地 LSTM 模型目录（用于 DJL 加载）
      path: ./models/lstm
      # 模型存储类型：mongo（默认，存到 MongoDB）或 local（存到本地卷 /models/lstm）
      storage-type: mongo
      # 当 storage-type=local 时，本地模型根目录（容器内部路径，挂载自 models-data 卷）
      local-base-path: /models/lstm
    sentiment:
      path: ./models/sentiment

# 训练配置
training:
  lstm:
    epochs: 100
    batchSize: 32
    learningRate: 0.001
  sentiment:
    epochs: 50
    batchSize: 16
    learningRate: 0.0001

# 策略配置
strategy:
  decision:
    confidence-threshold: 0.7
    max-position-size: 10000
  selector:
    min-volume: 100000
    min-price: 5.0
    max-pe: 100
logging:
  level:
    root: INFO
    com.stock: INFO
    ai.djl: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
app:
  startup:
    history-sync:
      enabled: true  # 历史数据初始化开关，启动时执行全量历史价格同步
    # 新闻采集开关：启动时遍历所有股票，先采集标题再获取详情写入数据库
    news-sync:
      enabled: true
    # Legacy 模型训练开关：默认关闭，避免应用启动后逐股票训练占用交易资源
    model-training:
      enabled: ${APP_STARTUP_MODEL_TRAINING_ENABLED:false}

  # 证券平台 HTTP 代理（用于解决云服务器 IP 被 weixin.citicsinfo.com 拦截 403 的问题）
  # 当远程部署返回 403 而本地可访问时，在本地/可访问机器搭建代理，远程通过此配置转发请求
  securities:
    proxy:
      enabled: false
      host: 127.0.0.1
      port: 1080
      # 类型: HTTP 或 SOCKS5
      type: HTTP

