server:
  port: ${AGENT_SERVER_PORT:8081}
  servlet:
    session:
      timeout: ${HTTP_SESSION_TIMEOUT:8h}
      cookie:
        name: STOCK_SESSION
        http-only: true
        same-site: lax
        secure: ${HTTP_SESSION_COOKIE_SECURE:false}

spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: stock-agent
  data:
    mongodb:
      auto-index-creation: true
      uri: mongodb://admin:${DATABASE_PASSWORD}@117.72.216.67:27017/stock_trading?authSource=admin
    redis:
      host: 117.72.216.67
      port: 6379
      password: ${DATABASE_PASSWORD}
      timeout: 3s
      connect-timeout: 3s
  session:
    store-type: redis
    redis:
      namespace: stock:session
      flush-mode: on-save
      save-mode: on-set-attribute
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

internal:
  api:
    token: ${INTERNAL_API_TOKEN:}

backend:
  service:
    enabled: ${BACKEND_SERVICE_ENABLED:true}
    base-url: ${BACKEND_SERVICE_BASE_URL:http://localhost:8080}
    connect-timeout-ms: ${BACKEND_SERVICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${BACKEND_SERVICE_READ_TIMEOUT_MS:10000}

agent:
  enabled: true
  provider: ${AGENT_PROVIDER:deepseek}
  deepseek:
    enabled: true
    base-url: https://api.deepseek.com/v1
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    max-tokens: 1024
    thinking-enabled: false
    daily-budget:
      enabled: true
      daily-limit-cny: 1.00
      input-price-cny-per-million: 2.10
      output-price-cny-per-million: 8.40
      safety-factor: 1.10
      reservation-overhead-tokens: 1024
  ollama:
    enabled: false
    base-url: http://localhost:11434
    api-key: ollama
    model: deepseek-r1:7b
    think: false
    max-tokens: 256
  max-steps: 6
  max-model-rounds: 3
  timeout-ms: 120000
  max-output-chars: 12000
  max-concurrency: 1
  circuit-breaker-enabled: true
  circuit-breaker-failure-threshold: 1
  circuit-breaker-open-duration-ms: 60000
  report-enabled: false
  trade-plan-enabled: false
  rag-enabled: true
  memory-enabled: true
  rag-collection: agent_rag_chunks
  memory-default-ttl-days: 90
  chat-memory-max-messages: 20
  tool-timeout-ms: 5000
  audit-enabled: true
  vector-store: mongodb
  embedding:
    enabled: true
    provider: djl
    base-url: http://localhost:11434
    api-key: ollama
    model: bge-base-zh-v1.5
    model-path: ${EMBEDDING_MODEL_PATH:./model-files/embedding}
    model-version: bge-base-zh-v1.5
    dimension: 768
    timeout-ms: 30000
    max-sequence-length: 512
    pooling-mode: cls
    normalize: true
    allow-hash-fallback: false

logging:
  level:
    root: INFO
    com.stock.agent: INFO
    ai.djl: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      uri: mongodb://admin:${DATABASE_PASSWORD}@stock-mongo:27017/stock_trading?authSource=admin
    redis:
      host: stock-redis
      port: 6379
      password: ${DATABASE_PASSWORD}

backend:
  service:
    base-url: http://stock-backend:8080

agent:
  embedding:
    model-path: /app/model-files/embedding

---
spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: true
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: false
