# AI_GENERATE_START
name: stock-trading

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  stock-web:
    image: ${STOCK_WEB_IMAGE:-stock-front:local}
    build:
      context: ./stock-frontend
      dockerfile: Dockerfile
    container_name: stock-web
    depends_on:
      stock-backend:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:80"
    networks:
      - stock-frontend
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  stock-backend:
    image: ${STOCK_BACKEND_IMAGE:-stock-trading-backend:local}
    build:
      context: ./stock-backend
      dockerfile: Dockerfile
    container_name: stock-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://stock-mysql:3306/stock_trading?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_MONGODB_HOST: stock-mongo
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: stock_trading
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: admin
      SPRING_DATA_MONGODB_USERNAME: admin
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD}
      TRADING_REAL_WRITE_ENABLED: ${TRADING_REAL_WRITE_ENABLED:-false}
      APP_NODE_ID: ${APP_NODE_ID:-stock-backend}
      SPRING_QUARTZ_AUTO_STARTUP: ${SPRING_QUARTZ_AUTO_STARTUP:-true}
      DATA_COLLECTION_ENABLED: ${DATA_COLLECTION_ENABLED:-true}
      NEWS_COLLECTION_ENABLED: ${NEWS_COLLECTION_ENABLED:-true}
      APP_STARTUP_LISTENER_ENABLED: ${APP_STARTUP_LISTENER_ENABLED:-true}
      APP_STARTUP_HISTORY_SYNC_ENABLED: ${APP_STARTUP_HISTORY_SYNC_ENABLED:-false}
      APP_STARTUP_NEWS_SYNC_ENABLED: ${APP_STARTUP_NEWS_SYNC_ENABLED:-false}
      LSTM_TRAINING_ENABLED: ${LSTM_TRAINING_ENABLED:-false}
      DEEPSEEK_API_ENABLE: ${DEEPSEEK_API_ENABLE:-false}
      AGENT_ENABLED: ${AGENT_ENABLED:-${DEEPSEEK_API_ENABLE:-false}}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-auto}
      AGENT_TIMEOUT_MS: ${AGENT_TIMEOUT_MS:-30000}
      AGENT_EMBEDDING_ENABLED: ${AGENT_EMBEDDING_ENABLED:-false}
      AGENT_EMBEDDING_PROVIDER: ${AGENT_EMBEDDING_PROVIDER:-djl}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-/models/embedding/bge-base-zh-v1.5}
      AGENT_CIRCUIT_BREAKER_ENABLED: ${AGENT_CIRCUIT_BREAKER_ENABLED:-true}
      AGENT_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${AGENT_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      AGENT_CIRCUIT_BREAKER_OPEN_DURATION_MS: ${AGENT_CIRCUIT_BREAKER_OPEN_DURATION_MS:-60000}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-256}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      AGENT_EMBEDDING_API_KEY: ${AGENT_EMBEDDING_API_KEY:-ollama}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DJL_DEFAULT_ENGINE: PyTorch
      SENTIMENT_MODEL_PATH: /models/sentiment
      SENTIMENT_MODEL_VERSION: ${SENTIMENT_MODEL_VERSION:-unconfigured}
      ZXBROKER_ENABLED: ${ZXBROKER_ENABLED:-false}
      ZXBROKER_MOBILE_CODE: ${ZXBROKER_MOBILE_CODE:-}
      ZXBROKER_ACCOUNT: ${ZXBROKER_ACCOUNT:-}
      ZXBROKER_ENCODED_PASSWORD: ${ZXBROKER_ENCODED_PASSWORD:-}
      ZXBROKER_CAPTCHA_AUTO_SUBMIT_ENABLED: ${ZXBROKER_CAPTCHA_AUTO_SUBMIT_ENABLED:-false}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      ZXBROKER_SIGN_KEY: ${ZXBROKER_SIGN_KEY:-}
      ZXBROKER_INTACT_TO_SERVER: ${ZXBROKER_INTACT_TO_SERVER:-}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx720m -XX:MaxDirectMemorySize=192m -Duser.timezone=Asia/Shanghai
    volumes:
      - ${SENTIMENT_ARTIFACT_HOST_DIR:-./stock-backend/data/models/sentiment}:/models/sentiment:ro
      - ${EMBEDDING_MODEL_HOST_DIR:-./stock-backend/data/models/embedding/bge-base-zh-v1.5}:/models/embedding/bge-base-zh-v1.5:ro
      - runtime-tmp:/app/.tmp
    depends_on:
      stock-mysql:
        condition: service_healthy
      stock-mongo:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:8080"
    networks:
      - stock-frontend
      - stock-backend
    restart: unless-stopped
    mem_limit: 1500m
    cpus: 1.25
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5
    logging: *default-logging

  stock-mysql:
    image: public.ecr.aws/docker/library/mysql:8.0.43
    container_name: stock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: stock_trading
    command:
      - --lower-case-table-names=${MYSQL_LOWER_CASE_TABLE_NAMES:-1}
      - --mysqlx=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --bind-address=0.0.0.0
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-./data/mysql}
        target: /var/lib/mysql
    ports:
      - "127.0.0.1:6033:3306"
    networks:
      - stock-backend
      - stock-db-access
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 10
    logging: *default-logging

  stock-mongo:
    image: public.ecr.aws/docker/library/mongo:8.0.32
    container_name: stock-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: stock_trading
    volumes:
      - type: bind
        source: ${MONGO_DATA_DIR:-./data/mongo}
        target: /data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - stock-backend
      - stock-db-access
    restart: unless-stopped
    mem_limit: 640m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 10
    logging: *default-logging

networks:
  stock-frontend:
    driver: bridge
  stock-backend:
    driver: bridge
    internal: true
  stock-db-access:
    driver: bridge

volumes:
  runtime-tmp:
# AI_GENERATE_END
