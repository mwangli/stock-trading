name: stock-trading

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  stock-python:
    profiles: ["training"]
    image: ${STOCK_PYTHON_IMAGE:-stock-trading-python:local}
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: stock-python
    environment:
      HF_HOME: /workspace/runtime/cache/huggingface
    volumes:
      - type: bind
        source: ./python/configs
        target: /workspace/configs
        read_only: true
      - type: bind
        source: ${PYTHON_RUNTIME_DIR:-./python/runtime}
        target: /workspace/runtime
    command: ["--help"]
    restart: "no"
    mem_limit: ${PYTHON_MEMORY_LIMIT:-24g}
    cpus: ${PYTHON_CPU_LIMIT:-6.0}
    logging: *default-logging
  stock-web:
    image: ${STOCK_WEB_IMAGE:-stock-trading-web:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-web
    depends_on:
      stock-backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_HTTP_PORT:-3000}:80"
    networks:
      - stock-frontend
    restart: ${RESTART_POLICY:-unless-stopped}
    mem_limit: ${WEB_MEMORY_LIMIT:-96m}
    cpus: ${WEB_CPU_LIMIT:-0.25}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  stock-backend:
    image: ${STOCK_BACKEND_IMAGE:-stock-trading-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:mysql://stock-mysql:3306/${MYSQL_DATABASE:-stock_trading}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_MONGODB_HOST: stock-mongo
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: ${MONGO_DATABASE:-stock_trading}
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: ${MONGO_AUTH_DATABASE:-admin}
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_ROOT_USER:-admin}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD}
      TRADING_REAL_WRITE_ENABLED: ${TRADING_REAL_WRITE_ENABLED:-false}
      LSTM_TRAINING_ENABLED: ${LSTM_TRAINING_ENABLED:-false}
      TRADING_HISTORY_MONTH_INTERVAL_MS: ${TRADING_HISTORY_MONTH_INTERVAL_MS:-500}
      TRADING_AUTO_BUY_AMOUNT: ${TRADING_AUTO_BUY_AMOUNT:-1000}
      TRADING_AUTO_CANDIDATE_LIMIT: ${TRADING_AUTO_CANDIDATE_LIMIT:-1}
      TRADING_TAKE_PROFIT_PERCENT: ${TRADING_TAKE_PROFIT_PERCENT:-3}
      TRADING_FORCE_EXIT_TIME: ${TRADING_FORCE_EXIT_TIME:-14:50}
      ZXBROKER_ENABLED: ${ZXBROKER_ENABLED:-false}
      ZXBROKER_MOBILE_CODE: ${ZXBROKER_MOBILE_CODE:-}
      ZXBROKER_ACCOUNT: ${ZXBROKER_ACCOUNT:-}
      ZXBROKER_ENCODED_PASSWORD: ${ZXBROKER_ENCODED_PASSWORD:-}
      ZXBROKER_OCR_MIN_AGREEMENT: ${ZXBROKER_OCR_MIN_AGREEMENT:-2}
      ZXBROKER_OCR_TIMEOUT_MS: ${ZXBROKER_OCR_TIMEOUT_MS:-20000}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      ZXBROKER_CAPTCHA_MAX_RETRIES: ${ZXBROKER_CAPTCHA_MAX_RETRIES:-3}
      ZXBROKER_TOKEN_EXPIRE_MINUTES: ${ZXBROKER_TOKEN_EXPIRE_MINUTES:-30}
      ZXBROKER_SIGN_KEY: ${ZXBROKER_SIGN_KEY:-}
      ZXBROKER_INTACT_TO_SERVER: ${ZXBROKER_INTACT_TO_SERVER:-}
      ZXBROKER_HISTORY_PAGE_SIZE: ${ZXBROKER_HISTORY_PAGE_SIZE:-500}
      ZXBROKER_HISTORY_MAX_RECORDS_PER_WINDOW: ${ZXBROKER_HISTORY_MAX_RECORDS_PER_WINDOW:-5000}
      ZXBROKER_HISTORY_REQUEST_INTERVAL_MS: ${ZXBROKER_HISTORY_REQUEST_INTERVAL_MS:-200}
      APP_STARTUP_HISTORY_SYNC_ENABLED: ${APP_STARTUP_HISTORY_SYNC_ENABLED:-false}
      APP_STARTUP_NEWS_SYNC_ENABLED: ${APP_STARTUP_NEWS_SYNC_ENABLED:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx720m -XX:MaxDirectMemorySize=192m -Duser.timezone=Asia/Shanghai}
    volumes:
      - models-data:/models
      - runtime-tmp:/app/.tmp
    depends_on:
      stock-mysql:
        condition: service_healthy
      stock-mongo:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_HTTP_PORT:-8080}:8080"
    networks:
      - stock-frontend
      - stock-backend
    restart: ${RESTART_POLICY:-unless-stopped}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1500m}
    cpus: ${BACKEND_CPU_LIMIT:-1.25}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5
    logging: *default-logging

  stock-mysql:
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.0.43}
    container_name: stock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stock_trading}
    command:
      - --lower-case-table-names=${MYSQL_LOWER_CASE_TABLE_NAMES:-1}
      - --mysqlx=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --bind-address=0.0.0.0
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-./data/mysql}
        target: /var/lib/mysql
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:-6033}:3306"
    networks:
      - stock-backend
      - stock-db-access
    restart: ${RESTART_POLICY:-unless-stopped}
    mem_limit: ${MYSQL_MEMORY_LIMIT:-512m}
    cpus: ${MYSQL_CPU_LIMIT:-0.50}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 10
    logging: *default-logging

  stock-mongo:
    image: ${MONGO_IMAGE:-public.ecr.aws/docker/library/mongo:8.0.32}
    container_name: stock-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-stock_trading}
    volumes:
      - type: bind
        source: ${MONGO_DATA_DIR:-./data/mongo}
        target: /data/db
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017"
    networks:
      - stock-backend
      - stock-db-access
    restart: ${RESTART_POLICY:-unless-stopped}
    mem_limit: ${MONGO_MEMORY_LIMIT:-640m}
    cpus: ${MONGO_CPU_LIMIT:-0.50}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 10
    logging: *default-logging

  mysql-backup:
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.0.43}
    profiles: ["backup"]
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /backup/mysql &&
        mysqldump -h stock-mysql -uroot --single-transaction --routines --events
        ${MYSQL_DATABASE:-stock_trading} | gzip -1 >
        /backup/mysql/${MYSQL_DATABASE:-stock_trading}-$$(date +%Y%m%d-%H%M%S).sql.gz
    volumes:
      - ./backups:/backup
    depends_on:
      stock-mysql:
        condition: service_healthy
    networks:
      - stock-backend
    restart: "no"

  mongo-backup:
    image: ${MONGO_IMAGE:-public.ecr.aws/docker/library/mongo:8.0.32}
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /backup/mongo &&
        mongodump --host stock-mongo --port 27017
        --username ${MONGO_ROOT_USER:-admin} --password "$$MONGO_ROOT_PASSWORD"
        --authenticationDatabase admin --db ${MONGO_DATABASE:-stock_trading}
        --archive=/backup/mongo/${MONGO_DATABASE:-stock_trading}-$$(date +%Y%m%d-%H%M%S).archive.gz
        --gzip
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - ./backups:/backup
    depends_on:
      stock-mongo:
        condition: service_healthy
    networks:
      - stock-backend
    restart: "no"

networks:
  stock-frontend:
    driver: bridge
  stock-backend:
    driver: bridge
    internal: true
  stock-db-access:
    driver: bridge

volumes:
  models-data:
  runtime-tmp:
