name: stock-console

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "5"

services:
  stock-frontend:
    <<: *service-defaults
    image: ${STOCK_FRONTEND_IMAGE:-stock-front:local}
    build:
      context: .
      dockerfile: stock-client/Dockerfile
    container_name: stock-frontend
    depends_on:
      stock-backend:
        condition: service_healthy
    ports:
      - "${STOCK_CONSOLE_PORT:-80}:80"
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  stock-backend:
    <<: *service-defaults
    image: ${STOCK_BACKEND_IMAGE:-stock-console-backend:local}
    build:
      context: .
      dockerfile: stock-server/Dockerfile
    container_name: stock-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONSOLE_USERNAME: ${CONSOLE_USERNAME:-admin}
      CONSOLE_PASSWORD_HASH: ${CONSOLE_PASSWORD_HASH:?CONSOLE_PASSWORD_HASH is required}
      CONSOLE_AUTH_PASSWORD_HASH: ${CONSOLE_PASSWORD_HASH:?CONSOLE_PASSWORD_HASH is required}
      STOCK_TRADING_VAR_DIR: /data/stock-trading
      STOCK_TASK_LOG: /var/log/stock-trading/stock-trading.log
      STOCK_DOCUMENT_ROOTS: /app/documents,/data/stock-trading-documents
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-90}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-1800}
      GITHUB_AGENT_ENABLED: ${GITHUB_AGENT_ENABLED:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-mwangli}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-stock-trading}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-stock-web}
      GITHUB_WORKFLOW: ${GITHUB_WORKFLOW:-ci-cd.yml}
      GITHUB_MAX_REPAIR_ROUNDS: ${GITHUB_MAX_REPAIR_ROUNDS:-2}
      GITHUB_POLL_INTERVAL_SECONDS: ${GITHUB_POLL_INTERVAL_SECONDS:-10}
      GITHUB_WORKFLOW_TIMEOUT_MINUTES: ${GITHUB_WORKFLOW_TIMEOUT_MINUTES:-45}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -Duser.timezone=Asia/Shanghai
    volumes:
      - type: bind
        source: ${STOCK_TRADING_VAR_DIR:?STOCK_TRADING_VAR_DIR is required}
        target: /data/stock-trading
        read_only: true
      - type: bind
        source: ${STOCK_TRADING_LOG_DIR:?STOCK_TRADING_LOG_DIR is required}
        target: /var/log/stock-trading
        read_only: true
      - type: bind
        source: ${STOCK_TRADING_DOCUMENTS_DIR:?STOCK_TRADING_DOCUMENTS_DIR is required}
        target: /data/stock-trading-documents
        read_only: true
      - type: bind
        source: ./documents
        target: /app/documents
        read_only: true
    ports:
      - "127.0.0.1:${STOCK_BACKEND_PORT:-8080}:8080"
    mem_limit: 640m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
