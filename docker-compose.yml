name: stock-trading

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  stock-web:
    image: ${STOCK_WEB_IMAGE:-stock-front:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-web
    depends_on:
      stock-backend:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:80"
    networks:
      - stock-frontend
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  stock-backend:
    image: ${STOCK_BACKEND_IMAGE:-stock-trading-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://stock-mysql:3306/stock_trading?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_MONGODB_HOST: stock-mongo
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: stock_trading
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: admin
      SPRING_DATA_MONGODB_USERNAME: admin
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD}
      TRADING_REAL_WRITE_ENABLED: ${TRADING_REAL_WRITE_ENABLED:-false}
      LSTM_TRAINING_ENABLED: ${LSTM_TRAINING_ENABLED:-false}
      DJL_DEFAULT_ENGINE: PyTorch
      SENTIMENT_MODEL_PATH: /models/sentiment
      ZXBROKER_ENABLED: ${ZXBROKER_ENABLED:-false}
      ZXBROKER_MOBILE_CODE: ${ZXBROKER_MOBILE_CODE:-}
      ZXBROKER_ACCOUNT: ${ZXBROKER_ACCOUNT:-}
      ZXBROKER_ENCODED_PASSWORD: ${ZXBROKER_ENCODED_PASSWORD:-}
      ZXBROKER_CAPTCHA_AUTO_SUBMIT_ENABLED: ${ZXBROKER_CAPTCHA_AUTO_SUBMIT_ENABLED:-false}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      ZXBROKER_SIGN_KEY: ${ZXBROKER_SIGN_KEY:-}
      ZXBROKER_INTACT_TO_SERVER: ${ZXBROKER_INTACT_TO_SERVER:-}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx720m -XX:MaxDirectMemorySize=192m -Duser.timezone=Asia/Shanghai
    volumes:
      - models-data:/models
      - runtime-tmp:/app/.tmp
    depends_on:
      stock-mysql:
        condition: service_healthy
      stock-mongo:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:8080"
    networks:
      - stock-frontend
      - stock-backend
    restart: unless-stopped
    mem_limit: 1500m
    cpus: 1.25
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5
    logging: *default-logging

  stock-mysql:
    image: public.ecr.aws/docker/library/mysql:8.0.43
    container_name: stock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: stock_trading
    command:
      - --lower-case-table-names=${MYSQL_LOWER_CASE_TABLE_NAMES:-1}
      - --mysqlx=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --bind-address=0.0.0.0
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-./data/mysql}
        target: /var/lib/mysql
    ports:
      - "127.0.0.1:6033:3306"
    networks:
      - stock-backend
      - stock-db-access
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 10
    logging: *default-logging

  stock-mongo:
    image: public.ecr.aws/docker/library/mongo:8.0.32
    container_name: stock-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: stock_trading
    volumes:
      - type: bind
        source: ${MONGO_DATA_DIR:-./data/mongo}
        target: /data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - stock-backend
      - stock-db-access
    restart: unless-stopped
    mem_limit: 640m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 10
    logging: *default-logging

  mysql-backup:
    image: public.ecr.aws/docker/library/mysql:8.0.43
    profiles: ["backup"]
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /backup/mysql &&
        mysqldump -h stock-mysql -uroot --single-transaction --routines --events
        stock_trading | gzip -1 >
        /backup/mysql/stock_trading-$$(date +%Y%m%d-%H%M%S).sql.gz
    volumes:
      - ./backups:/backup
    depends_on:
      stock-mysql:
        condition: service_healthy
    networks:
      - stock-backend
    restart: "no"

  mongo-backup:
    image: public.ecr.aws/docker/library/mongo:8.0.32
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /backup/mongo &&
        mongodump --host stock-mongo --port 27017
        --username admin --password "$$MONGO_ROOT_PASSWORD"
        --authenticationDatabase admin --db stock_trading
        --archive=/backup/mongo/stock_trading-$$(date +%Y%m%d-%H%M%S).archive.gz
        --gzip
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - ./backups:/backup
    depends_on:
      stock-mongo:
        condition: service_healthy
    networks:
      - stock-backend
    restart: "no"

networks:
  stock-frontend:
    driver: bridge
  stock-backend:
    driver: bridge
    internal: true
  stock-db-access:
    driver: bridge

volumes:
  models-data:
  runtime-tmp:
