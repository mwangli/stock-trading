# AI_GENERATE_START---
name: stock-trading

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "5"

services:
  stock-frontend:
    <<: *service-defaults
    image: ${STOCK_FRONTEND_IMAGE:-stock-trading-frontend:local}
    build:
      context: .
      dockerfile: stock-client/Dockerfile
    container_name: stock-frontend
    depends_on:
      stock-backend:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:80"
    mem_limit: 96m
    cpus: 0.15
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

  stock-backend:
    <<: *service-defaults
    image: ${STOCK_BACKEND_IMAGE:-stock-trading-backend:local}
    build:
      context: .
      dockerfile: stock-server/Dockerfile
    container_name: stock-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://stock-mysql:3306/stock_trading?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: stock
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      SPRING_DATA_MONGODB_URI: mongodb://admin:${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}@stock-mongo:27017/stock_trading?authSource=admin
      SPRING_FLYWAY_ENABLED: "true"
      AGENT_EMBEDDING_MODEL_PATH: /app/model-files/embedding
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      APP_NODE_ID: ${APP_NODE_ID:-stock-backend}
      APP_STARTUP_DATA_SYNC_ENABLED: ${APP_STARTUP_DATA_SYNC_ENABLED:-true}
      DJL_DEFAULT_ENGINE: PyTorch
      ZXBROKER_MOBILE_CODE: ${ZXBROKER_MOBILE_CODE:-}
      ZXBROKER_ACCOUNT: ${ZXBROKER_ACCOUNT:-}
      ZXBROKER_ENCODED_PASSWORD: ${ZXBROKER_ENCODED_PASSWORD:-}
      ZXBROKER_BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      ZXBROKER_BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      ZXBROKER_SIGN_KEY: ${ZXBROKER_SIGN_KEY:-}
      ZXBROKER_INTACT_TO_SERVER: ${ZXBROKER_INTACT_TO_SERVER:-}
      JAVA_TOOL_OPTIONS: -Xms384m -Xmx1024m -XX:MaxDirectMemorySize=256m -Duser.timezone=Asia/Shanghai
    volumes:
      - type: bind
        source: ${MODEL_FILES_DIR:-./model-files}
        target: /app/model-files
        read_only: true
      - backend-runtime-tmp:/app/.tmp
    depends_on:
      stock-mysql:
        condition: service_healthy
      stock-mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - stock-internal
    mem_limit: 1536m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  stock-mysql:
    <<: *service-defaults
    image: public.ecr.aws/docker/library/mysql:8.4
    container_name: stock-mysql
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MYSQL_DATABASE: stock_trading
      MYSQL_USER: stock
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-./data/mysql}
        target: /var/lib/mysql
    ports:
      - "0.0.0.0:6033:3306"
    networks:
      - stock-internal
      - stock-db-access
    mem_limit: 512m
    cpus: 0.35
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10

  stock-mongo:
    <<: *service-defaults
    image: public.ecr.aws/docker/library/mongo:8.0.32
    container_name: stock-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MONGO_INITDB_DATABASE: stock_trading
    volumes:
      - type: bind
        source: ${MONGO_DATA_DIR:-./data/mongo}
        target: /data/db
    ports:
      - "0.0.0.0:27017:27017"
    networks:
      - stock-internal
      - stock-db-access
    mem_limit: 512m
    cpus: 0.35
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 10

networks:
  stock-internal:
    internal: true
  stock-db-access:

volumes:
  backend-runtime-tmp:
# AI_GENERATE_END---
