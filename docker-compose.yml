# AI_GENERATE_START
name: stock-trading

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  stock-backend:
    image: ${STOCK_BACKEND_IMAGE:-stock-trading-backend:local}
    build:
      context: ./stock-backend
      dockerfile: Dockerfile
    container_name: stock-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EMBEDDING_MODEL_PATH: /app/model-artifacts/embedding
      EMBEDDING_DOWNLOAD_PRETRAINED: ${EMBEDDING_DOWNLOAD_PRETRAINED:-true}
      SPRING_DATASOURCE_URL: jdbc:mysql://stock-mysql:3306/${MYSQL_DATABASE:-stock_trading}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-stock}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_DATA_MONGODB_URI: mongodb://admin:${MONGO_ROOT_PASSWORD}@stock-mongo:27017/stock_trading?authSource=admin
      SPRING_DATA_REDIS_HOST: stock-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TRADING_REAL_WRITE_ENABLED: ${TRADING_REAL_WRITE_ENABLED:-false}
      APP_NODE_ID: ${APP_NODE_ID:-stock-backend}
      SPRING_QUARTZ_AUTO_STARTUP: ${SPRING_QUARTZ_AUTO_STARTUP:-true}
      APP_STARTUP_DATA_SYNC_ENABLED: ${APP_STARTUP_DATA_SYNC_ENABLED:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DJL_DEFAULT_ENGINE: PyTorch
      ZXBROKER_ENABLED: ${ZXBROKER_ENABLED:-false}
      ZXBROKER_MOBILE_CODE: ${ZXBROKER_MOBILE_CODE:-}
      ZXBROKER_ACCOUNT: ${ZXBROKER_ACCOUNT:-}
      ZXBROKER_ENCODED_PASSWORD: ${ZXBROKER_ENCODED_PASSWORD:-}
      ZXBROKER_CAPTCHA_AUTO_SUBMIT_ENABLED: ${ZXBROKER_CAPTCHA_AUTO_SUBMIT_ENABLED:-false}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      ZXBROKER_SIGN_KEY: ${ZXBROKER_SIGN_KEY:-}
      ZXBROKER_INTACT_TO_SERVER: ${ZXBROKER_INTACT_TO_SERVER:-}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx720m -XX:MaxDirectMemorySize=192m -Duser.timezone=Asia/Shanghai
    volumes:
      - runtime-tmp:/app/.tmp
      - ./model-artifacts:/app/model-artifacts:ro
    depends_on:
      stock-mysql:
        condition: service_healthy
      stock-mongo:
        condition: service_healthy
      stock-redis:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:8080"
    networks:
      - stock-public
      - stock-internal
    restart: unless-stopped
    mem_limit: 1500m
    cpus: 1.25
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5
    logging: *default-logging

  stock-mysql:
    image: mysql:8.4
    container_name: stock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stock_trading}
      MYSQL_USER: ${MYSQL_USER:-stock}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-./data/mysql}
        target: /var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - stock-internal
      - stock-db-access
    restart: unless-stopped
    mem_limit: 640m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10
    logging: *default-logging

  stock-mongo:
    image: public.ecr.aws/docker/library/mongo:8.0.32
    container_name: stock-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: stock_trading
    volumes:
      - type: bind
        source: ${MONGO_DATA_DIR:-./data/mongo}
        target: /data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - stock-internal
      - stock-db-access
    restart: unless-stopped
    mem_limit: 640m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 10
    logging: *default-logging

  stock-redis:
    image: redis:7.4-alpine
    container_name: stock-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - type: bind
        source: ${REDIS_DATA_DIR:-./data/redis}
        target: /data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - stock-internal
      - stock-db-access
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 10
    logging: *default-logging

networks:
  stock-public:
    driver: bridge
  stock-internal:
    driver: bridge
    internal: true
  stock-db-access:
    driver: bridge

volumes:
  runtime-tmp:
# AI_GENERATE_END
