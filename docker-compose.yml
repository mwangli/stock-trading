name: stock-trading

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  stock-web:
    image: ${STOCK_WEB_IMAGE:-stock-trading-web:local}
    container_name: stock-web
    depends_on:
      stock-backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - stock-frontend
    restart: unless-stopped
    logging: *default-logging

  stock-backend:
    image: ${STOCK_BACKEND_IMAGE:-stock-trading-backend:local}
    container_name: stock-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:mysql://stock-mysql:3306/${MYSQL_DATABASE:-stock_trading}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_APP_USER:-stock}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD}
      SPRING_DATA_MONGODB_HOST: stock-mongo
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: ${MONGO_DATABASE:-stock_trading}
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: admin
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_APP_USER:-stock}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_APP_PASSWORD}
      SPRING_DATA_REDIS_HOST: stock-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: ${REDIS_DATABASE:-0}
      TRADING_REAL_WRITE_ENABLED: ${TRADING_REAL_WRITE_ENABLED:-false}
      TRADING_HISTORY_MONTH_INTERVAL_MS: ${TRADING_HISTORY_MONTH_INTERVAL_MS:-500}
      TRADING_AUTO_BUY_AMOUNT: ${TRADING_AUTO_BUY_AMOUNT:-1000}
      TRADING_AUTO_CANDIDATE_LIMIT: ${TRADING_AUTO_CANDIDATE_LIMIT:-1}
      TRADING_TAKE_PROFIT_PERCENT: ${TRADING_TAKE_PROFIT_PERCENT:-3}
      TRADING_FORCE_EXIT_TIME: ${TRADING_FORCE_EXIT_TIME:-14:50}
      ZXBROKER_ENABLED: ${ZXBROKER_ENABLED:-false}
      ZXBROKER_MOBILE_CODE: ${ZXBROKER_MOBILE_CODE:-}
      ZXBROKER_ACCOUNT: ${ZXBROKER_ACCOUNT:-}
      ZXBROKER_ENCODED_PASSWORD: ${ZXBROKER_ENCODED_PASSWORD:-}
      ZXBROKER_OCR_MIN_AGREEMENT: ${ZXBROKER_OCR_MIN_AGREEMENT:-2}
      ZXBROKER_OCR_TIMEOUT_MS: ${ZXBROKER_OCR_TIMEOUT_MS:-20000}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      ZXBROKER_CAPTCHA_MAX_RETRIES: ${ZXBROKER_CAPTCHA_MAX_RETRIES:-3}
      ZXBROKER_TOKEN_EXPIRE_MINUTES: ${ZXBROKER_TOKEN_EXPIRE_MINUTES:-30}
      ZXBROKER_TOKEN_REDIS_KEY: ${ZXBROKER_TOKEN_REDIS_KEY:-stock-trading:zxbroker:token}
      ZXBROKER_SIGN_KEY: ${ZXBROKER_SIGN_KEY:-}
      ZXBROKER_INTACT_TO_SERVER: ${ZXBROKER_INTACT_TO_SERVER:-}
      ZXBROKER_HISTORY_PAGE_SIZE: ${ZXBROKER_HISTORY_PAGE_SIZE:-500}
      ZXBROKER_HISTORY_MAX_RECORDS_PER_WINDOW: ${ZXBROKER_HISTORY_MAX_RECORDS_PER_WINDOW:-5000}
      ZXBROKER_HISTORY_REQUEST_INTERVAL_MS: ${ZXBROKER_HISTORY_REQUEST_INTERVAL_MS:-200}
      APP_STARTUP_HISTORY_SYNC_ENABLED: ${APP_STARTUP_HISTORY_SYNC_ENABLED:-false}
      APP_STARTUP_NEWS_SYNC_ENABLED: ${APP_STARTUP_NEWS_SYNC_ENABLED:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai}
    volumes:
      - models-data:/models
      - runtime-tmp:/app/.tmp
    depends_on:
      stock-mysql:
        condition: service_healthy
      stock-mongo:
        condition: service_healthy
      stock-redis:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - stock-frontend
      - stock-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5
    logging: *default-logging

  stock-redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: stock-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - stock-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    logging: *default-logging
  stock-mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.43}
    container_name: stock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stock_trading}
      MYSQL_USER: ${MYSQL_APP_USER:-stock}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --bind-address=0.0.0.0
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "3306"
    networks:
      - stock-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    logging: *default-logging

  stock-mongo:
    image: ${MONGO_IMAGE:-mongo:6.0.26}
    container_name: stock-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-stock_trading}
      MONGO_APP_USER: ${MONGO_APP_USER:-stock}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./infrastructure/mongo/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "27017"
    networks:
      - stock-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"quit(db.adminCommand('ping').ok ? 0 : 2)\""]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10
    logging: *default-logging

  mysql-backup:
    image: ${MYSQL_IMAGE:-mysql:8.0.43}
    profiles: ["backup"]
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /backup/mysql &&
        mysqldump -h stock-mysql -uroot --single-transaction --routines --events
        ${MYSQL_DATABASE:-stock_trading} >
        /backup/mysql/${MYSQL_DATABASE:-stock_trading}-$$(date +%Y%m%d-%H%M%S).sql
    volumes:
      - ./backups:/backup
    depends_on:
      stock-mysql:
        condition: service_healthy
    networks:
      - stock-backend
    restart: "no"

  mongo-backup:
    image: ${MONGO_IMAGE:-mongo:6.0.26}
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /backup/mongo &&
        mongodump --host stock-mongo --port 27017
        --username ${MONGO_ROOT_USER:-root} --password "$${MONGO_ROOT_PASSWORD}"
        --authenticationDatabase admin --db ${MONGO_DATABASE:-stock_trading}
        --archive=/backup/mongo/${MONGO_DATABASE:-stock_trading}-$$(date +%Y%m%d-%H%M%S).archive.gz
        --gzip
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - ./backups:/backup
    depends_on:
      stock-mongo:
        condition: service_healthy
    networks:
      - stock-backend
    restart: "no"

networks:
  stock-frontend:
    driver: bridge
  stock-backend:
    driver: bridge
    internal: true

volumes:
  redis-data:
  mysql-data:
  mongo-data:
  models-data:
  runtime-tmp:
